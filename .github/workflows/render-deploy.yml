name: Deploy to Render

on:
  push:
    branches:
      - main
      - staging
      - development
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: backend/requirements/*.txt
          
      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements/dev.txt
          
      - name: Run tests with coverage
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=html
          
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: codecov-umbrella
          
      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: backend/htmlcov/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          
      - name: Run Bandit (Python security linter)
        run: |
          cd backend
          pip install bandit safety
          bandit -r app/ -ll -f json -o bandit-report.json
          safety check -r requirements/production.txt --json > safety-report.json
          
      - name: Upload security reports
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: |
            backend/bandit-report.json
            backend/safety-report.json

  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' || github.event.inputs.environment != ''
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.worker
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:worker-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://hanadiz-staging.onrender.com
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Render CLI
        run: |
          curl -fsSL https://render.com/install.sh | sh
          sudo mv render /usr/local/bin/
          
      - name: Deploy to Render (Staging)
        run: |
          render deploy --service-id ${{ secrets.STAGING_SERVICE_ID }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          
      - name: Wait for deployment
        run: |
          echo "Waiting for deployment to complete..."
          sleep 60
          
      - name: Run health checks
        run: |
          curl -f https://hanadiz-staging.onrender.com/health || exit 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://hanadiz-backend.onrender.com
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Render CLI
        run: |
          curl -fsSL https://render.com/install.sh | sh
          sudo mv render /usr/local/bin/
          
      - name: Deploy to Render (Production)
        run: |
          render deploy --service-id ${{ secrets.PRODUCTION_SERVICE_ID }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          
      - name: Wait for deployment
        run: |
          echo "Waiting for deployment to complete..."
          sleep 90
          
      - name: Run health checks
        run: |
          curl -f https://hanadiz-backend.onrender.com/health || exit 1
          
      - name: Run database migrations
        run: |
          render run-command --service-id ${{ secrets.PRODUCTION_SERVICE_ID }} "alembic upgrade head"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          
      - name: Clear cache
        run: |
          render run-command --service-id ${{ secrets.PRODUCTION_SERVICE_ID }} "python scripts/clear_cache.py"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy-production
    if: failure()
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Render CLI
        run: |
          curl -fsSL https://render.com/install.sh | sh
          sudo mv render /usr/local/bin/
          
      - name: Rollback to previous version
        run: |
          echo "🔄 Rolling back production deployment..."
          render rollback --service-id ${{ secrets.PRODUCTION_SERVICE_ID }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          
      - name: Notify rollback
        run: |
          echo "⚠️ Production deployment failed, rolled back to previous version"
          # Add notification here (Slack, Email, etc.)