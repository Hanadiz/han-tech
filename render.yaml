# ============================================
# Hanadiz Backend - Render Blueprint Configuration
# ============================================

services:
  # ============================================
  # BACKEND API SERVICE
  # ============================================
  - type: web
    name: hanadiz-backend-api
    runtime: docker
    repo: https://github.com/Hanadiz/han-tech
    plan: standard
    region: virginia
    branch: main
    
    # Root directory where Dockerfile is located
    rootDir: backend
    
    # Docker build configuration
    dockerfilePath: ./Dockerfile
    dockerContext: .
    
    # Environment Variables
    envVars:
      # Application
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: PORT
        value: 8000
      - key: WORKERS
        value: 4
      - key: HOST
        value: 0.0.0.0
      
      # Security (Auto-generated)
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      
      # Database (Linked from Render)
      - key: DATABASE_URL
        fromDatabase:
          name: hanadiz-db
          property: connectionString
      - key: DATABASE_POOL_SIZE
        value: 10
      - key: DATABASE_MAX_OVERFLOW
        value: 20
      
      # Redis (Linked from Render)
      - key: REDIS_URL
        fromService:
          type: redis
          name: hanadiz-redis
          property: connectionString
      - key: REDIS_SSL
        value: true
      
      # Email Configuration
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: true
      - key: SMTP_FROM_EMAIL
        value: noreply@hanadiz.com
      
      # Payment Gateways
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: live
      
      # CORS
      - key: CORS_ORIGINS
        value: https://hanadiz-client.onrender.com,https://hanadiz-admin.onrender.com
      
      # Logging & Monitoring
      - key: LOG_LEVEL
        value: INFO
      - key: SENTRY_DSN
        sync: false
      - key: PROMETHEUS_ENABLED
        value: true
      
      # Rate Limiting
      - key: RATE_LIMIT_PER_MINUTE
        value: 100
      - key: MAX_UPLOAD_SIZE
        value: 10485760
      
      # Backup
      - key: BACKUP_RETENTION_DAYS
        value: 30
      - key: BACKUP_PATH
        value: /app/backend/storage/backups
      
      # Celery
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: hanadiz-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: hanadiz-redis
          property: connectionString
      - key: CELERY_TASK_SERIALIZER
        value: json
      - key: CELERY_ACCEPT_CONTENT
        value: json
    
    # Health Check
    healthCheckPath: /health
    healthCheckTimeout: 100
    
    # Auto-scaling (for paid plans)
    scaling:
      minInstances: 1
      maxInstances: 10
      targetMemoryPercent: 70
      targetCPUPercent: 60
    
    # Persistent Disk
    disk:
      name: backend-storage
      mountPath: /app/backend/storage
      sizeGB: 10

  # ============================================
  # CELERY WORKER SERVICE
  # ============================================
  - type: worker
    name: hanadiz-celery-worker
    runtime: docker
    repo: https://github.com/Hanadiz/han-tech
    plan: starter
    region: virginia
    branch: main
    
    rootDir: backend
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hanadiz-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: hanadiz-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: hanadiz-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: hanadiz-redis
          property: connectionString
      - key: CELERY_TASK_SERIALIZER
        value: json
      - key: CELERY_ACCEPT_CONTENT
        value: json

  # ============================================
  # CELERY BEAT SCHEDULER
  # ============================================
  - type: worker
    name: hanadiz-celery-beat
    runtime: docker
    repo: https://github.com/Hanadiz/han-tech
    plan: starter
    region: virginia
    branch: main
    
    rootDir: backend
    dockerfilePath: ./Dockerfile.beat
    dockerContext: .
    
    envVars:
      - key: APP_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: redis
          name: hanadiz-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: hanadiz-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: hanadiz-redis
          property: connectionString

  # ============================================
  # FLOWER MONITORING SERVICE
  # ============================================
  - type: web
    name: hanadiz-flower
    runtime: docker
    repo: https://github.com/Hanadiz/han-tech
    plan: starter
    region: virginia
    branch: main
    
    rootDir: backend
    dockerfilePath: ./Dockerfile.flower
    dockerContext: .
    
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: hanadiz-redis
          property: connectionString
      - key: FLOWER_PASSWORD
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
    
    healthCheckPath: /health

# ============================================
# DATABASE CONFIGURATION
# ============================================
databases:
  - name: hanadiz-db
    databaseName: hanadiz_production
    user: hanadiz_admin
    plan: standard
    region: virginia
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
    postgresMajorVersion: 15
    extensions:
      - uuid-ossp
      - pgcrypto
      - citext
    backup:
      retentionPeriod: 30
      schedule: 0 2 * * *

# ============================================
# REDIS CONFIGURATION
# ============================================
- type: redis
  name: hanadiz-redis
  plan: starter
  region: virginia
  maxmemoryPolicy: allkeys-lru
  ipAllowList:
    - source: 0.0.0.0/0
      description: everywhere