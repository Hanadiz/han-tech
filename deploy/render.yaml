services:
  - type: web
    name: hanadiz
    runtime: docker
    repo: https://github.com/yourusername/han-tech
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://hanadiz-api.onrender.com
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: dpg-d8v368rsq97s73ftekv0-a
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        value: hanadiz_db
      - key: DB_USERNAME
        value: hanadiz_user
      - key: DB_PASSWORD
        value: upIuiVL1O5VuTLQITwKQLvMnI7kpWysv
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_DOMAIN
        value: hanadiz-api.onrender.com
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error