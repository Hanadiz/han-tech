<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register | Han-Tech Ltd</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0f0f1a, #1a1a2e, #16213e); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .register-container { background: #fff; border-radius: 24px; padding: 50px 40px; width: 100%; max-width: 480px; box-shadow: 0 25px 50px rgba(0,0,0,0.3); }
        [data-theme="dark"] .register-container { background: #1a1a2e; }
        h2 { font-family: 'Poppins', sans-serif; font-weight: 700; text-align: center; }
        .form-control { border-radius: 12px; padding: 14px 18px; border: 2px solid #e0e0e0; }
        [data-theme="dark"] .form-control { background: #0f0f1a; border-color: #2a2a40; color: #e0e0e0; }
        .form-control:focus { border-color: #00b4d8; box-shadow: 0 0 0 4px rgba(0,180,216,0.1); }
        .btn-register { background: linear-gradient(135deg, #0077b6, #00b4d8); color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 600; width: 100%; }
        .password-strength { height: 4px; border-radius: 2px; margin-top: 5px; transition: 0.3s; }
        .strength-weak { width: 25%; background: #e74c3c; }
        .strength-medium { width: 50%; background: #f39c12; }
        .strength-strong { width: 75%; background: #2ecc71; }
        .strength-very-strong { width: 100%; background: #27ae60; }
        .error-message { color: #e74c3c; font-size: 0.8rem; display: none; }
    </style>
</head>
<body>
    <div class="register-container">
        <h2>Create Account</h2>
        <p class="text-center text-muted mb-4">Join Han‑Tech today</p>
        <form id="registerForm" autocomplete="off">
            <input type="hidden" id="csrfToken">
            <div class="mb-3"><label>Full Name</label><input type="text" class="form-control" id="name" required><div class="error-message" id="nameError"></div></div>
            <div class="mb-3"><label>Email</label><input type="email" class="form-control" id="email" required><div class="error-message" id="emailError"></div></div>
            <div class="mb-3"><label>Password</label><input type="password" class="form-control" id="password" required minlength="8"><div class="password-strength" id="strengthBar"></div><div class="error-message" id="passwordError"></div></div>
            <div class="mb-3"><label>Confirm Password</label><input type="password" class="form-control" id="confirmPassword" required><div class="error-message" id="confirmError"></div></div>
            <div class="mb-3 form-check"><input type="checkbox" class="form-check-input" id="terms" required><label class="form-check-label" for="terms">I agree to the <a href="/pages/terms/">Terms</a></label></div>
            <button type="submit" class="btn-register" id="registerBtn">Create Account</button>
        </form>
        <p class="text-center mt-3">Already have an account? <a href="/auth/login/index.html" style="color:#0077b6;">Sign in</a></p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function() {
            // CSRF token
            document.getElementById('csrfToken').value = Array.from(crypto.getRandomValues(new Uint8Array(32))).map(b => b.toString(16).padStart(2,'0')).join('');

            // Password strength checker
            document.getElementById('password').addEventListener('input', function() {
                const pw = this.value;
                const bar = document.getElementById('strengthBar');
                bar.className = 'password-strength';
                let score = 0;
                if (pw.length >= 8) score++;
                if (/[A-Z]/.test(pw)) score++;
                if (/[0-9]/.test(pw)) score++;
                if (/[^A-Za-z0-9]/.test(pw)) score++;
                if (score === 0) bar.className = 'password-strength';
                else if (score === 1) bar.className = 'password-strength strength-weak';
                else if (score === 2) bar.className = 'password-strength strength-medium';
                else if (score === 3) bar.className = 'password-strength strength-strong';
                else bar.className = 'password-strength strength-very-strong';
            });

            document.getElementById('registerForm').addEventListener('submit', function(e) {
                e.preventDefault();
                let valid = true;
                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();
                const pw = document.getElementById('password').value;
                const confirm = document.getElementById('confirmPassword').value;
                if (name.length < 2) { document.getElementById('nameError').style.display='block'; document.getElementById('nameError').textContent='Name required'; valid = false; }
                else document.getElementById('nameError').style.display='none';
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { document.getElementById('emailError').style.display='block'; document.getElementById('emailError').textContent='Invalid email'; valid = false; }
                else document.getElementById('emailError').style.display='none';
                if (pw.length < 8) { document.getElementById('passwordError').style.display='block'; document.getElementById('passwordError').textContent='Min 8 characters'; valid = false; }
                else document.getElementById('passwordError').style.display='none';
                if (pw !== confirm) { document.getElementById('confirmError').style.display='block'; document.getElementById('confirmError').textContent='Passwords must match'; valid = false; }
                else document.getElementById('confirmError').style.display='none';
                if (!valid) return;
                alert('Account created! Check your email to verify.');
                // Redirect to verification
                window.location.href = '/auth/register/email-verification.html';
            });
        })();
    </script>
</body>
</html>
