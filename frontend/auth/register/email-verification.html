<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Verify Email | Han-Tech Ltd</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0f0f1a,#1a1a2e,#16213e);min-height:100vh;display:flex;align-items:center;justify-content:center}.verify-card{background:#fff;border-radius:24px;padding:50px;max-width:450px;text-align:center;box-shadow:0 25px 50px rgba(0,0,0,0.3)}h3{font-family:'Poppins',sans-serif}.btn-verify{background:linear-gradient(135deg,#0077b6,#00b4d8);color:#fff;border:none;padding:14px 36px;border-radius:12px;font-weight:600}.code-input{width:50px;height:50px;text-align:center;font-size:1.5rem;border-radius:10px;border:2px solid #e0e0e0;margin:0 5px}</style></head><body><div class="verify-card"><h3>Verify Your Email</h3><p>We sent a 6‑digit code to your email.</p><div class="d-flex justify-content-center my-4"><input type="text" class="code-input" maxlength="1" id="c1"><input type="text" class="code-input" maxlength="1" id="c2"><input type="text" class="code-input" maxlength="1" id="c3"><input type="text" class="code-input" maxlength="1" id="c4"><input type="text" class="code-input" maxlength="1" id="c5"><input type="text" class="code-input" maxlength="1" id="c6"></div><button class="btn-verify" onclick="alert('Verified!')">Verify</button><p class="mt-3"><a href="#">Resend code</a></p></div><script>document.querySelectorAll('.code-input').forEach((el,idx,arr)=>{el.addEventListener('input',()=>{if(el.value&&idx<arr.length-1)arr[idx+1].focus()});el.addEventListener('keydown',(e)=>{if(e.key==='Backspace'&&!el.value&&idx>0)arr[idx-1].focus()})})</script></body></html>
