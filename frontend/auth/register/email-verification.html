<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email | Han-Tech Ltd</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --tech-blue: #0077b6; --gradient-tech: linear-gradient(135deg, #0077b6, #00b4d8); }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0f0f1a, #1a1a2e, #16213e); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .verify-card { background: #fff; border-radius: 24px; padding: 50px 40px; width: 100%; max-width: 480px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.3); }
        [data-theme="dark"] .verify-card { background: #1a1a2e; }
        .verify-icon { font-size: 4rem; color: #0077b6; margin-bottom: 20px; }
        h2 { font-family: 'Poppins', sans-serif; font-weight: 700; color: #2c3e50; margin-bottom: 8px; }
        [data-theme="dark"] h2 { color: #e0e0e0; }
        p { color: #666; margin-bottom: 8px; }
        [data-theme="dark"] p { color: #94a3b8; }
        .email-highlight { font-weight: 600; color: #0077b6; background: rgba(0,119,182,0.1); padding: 2px 10px; border-radius: 6px; }
        .code-container { display: flex; justify-content: center; gap: 10px; margin: 30px 0; }
        .code-input { width: 52px; height: 60px; text-align: center; font-size: 1.8rem; font-weight: 700; border-radius: 12px; border: 2px solid #e0e0e0; background: #f9fafb; color: #2c3e50; transition: 0.3s; }
        [data-theme="dark"] .code-input { background: #0f0f1a; border-color: #2a2a40; color: #e0e0e0; }
        .code-input:focus { border-color: #00b4d8; box-shadow: 0 0 0 4px rgba(0,180,216,0.1); outline: none; }
        .code-input.filled { border-color: #2ecc71; background: rgba(46,204,113,0.05); }
        .code-input.error { border-color: #e74c3c; background: rgba(231,76,60,0.05); animation: shake 0.4s; }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-4px); } }
        .btn-verify { background: var(--gradient-tech); color: #fff; border: none; padding: 14px 36px; border-radius: 12px; font-weight: 600; font-size: 1rem; width: 100%; cursor: pointer; transition: 0.3s; }
        .btn-verify:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-verify:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .timer-container { margin: 15px 0; }
        .timer { font-size: 0.9rem; color: #f39c12; font-weight: 600; }
        .timer.expired { color: #e74c3c; }
        .resend-btn { background: none; border: none; color: #0077b6; font-weight: 600; cursor: pointer; text-decoration: underline; font-size: 0.9rem; }
        .resend-btn:disabled { color: #999; cursor: not-allowed; text-decoration: none; }
        .error-message { color: #e74c3c; font-size: 0.85rem; margin-top: 10px; display: none; }
        .success-message { color: #2ecc71; font-size: 0.85rem; margin-top: 10px; display: none; }
        .spinner { display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .back-link { display: block; margin-top: 20px; color: #666; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { color: #0077b6; }
    </style>
</head>
<body>
    <div class="verify-card">
        <div class="verify-icon">
            <i class="bi bi-envelope-check"></i>
        </div>
        <h2>Verify Your Email</h2>
        <p>We sent a 6‑digit code to</p>
        <p class="email-highlight" id="userEmail">loading...</p>
        <p class="text-muted small">The code expires in <strong>5 minutes</strong></p>

        <!-- 6-Digit Code Input -->
        <div class="code-container" id="codeContainer">
            <input type="text" class="code-input" maxlength="1" id="c1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
            <input type="text" class="code-input" maxlength="1" id="c2" inputmode="numeric" pattern="[0-9]" autocomplete="off">
            <input type="text" class="code-input" maxlength="1" id="c3" inputmode="numeric" pattern="[0-9]" autocomplete="off">
            <input type="text" class="code-input" maxlength="1" id="c4" inputmode="numeric" pattern="[0-9]" autocomplete="off">
            <input type="text" class="code-input" maxlength="1" id="c5" inputmode="numeric" pattern="[0-9]" autocomplete="off">
            <input type="text" class="code-input" maxlength="1" id="c6" inputmode="numeric" pattern="[0-9]" autocomplete="off">
        </div>

        <!-- Timer -->
        <div class="timer-container">
            <span class="timer" id="timer">⏱ Code expires in <strong id="timerMinutes">5</strong>:<strong id="timerSeconds">00</strong></span>
        </div>

        <!-- Messages -->
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <!-- Verify Button -->
        <button class="btn-verify" id="verifyBtn" onclick="verifyCode()">
            <span class="spinner" id="verifySpinner"></span>
            Verify Email
        </button>

        <!-- Resend -->
        <div class="mt-3">
            <span class="text-muted small">Didn't receive the code?</span>
            <button class="resend-btn" id="resendBtn" onclick="resendCode()" disabled>Resend Code</button>
        </div>

        <a href="/auth/login/index.html" class="back-link">← Back to Login</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function() {
            // ========== CONFIGURATION ==========
            const CODE_EXPIRY_MINUTES = 5;  // 5-minute expiry
            const RESEND_COOLDOWN = 60;      // 60 seconds before resend allowed
            const TOTAL_SECONDS = CODE_EXPIRY_MINUTES * 60;

            // ========== STATE ==========
            let timeLeft = TOTAL_SECONDS;
            let timerInterval = null;
            let resendCooldown = RESEND_COOLDOWN;
            let resendInterval = null;

            // Simulated stored verification code (from registration)
            const storedEmail = sessionStorage.getItem('verifyEmail') || 'user@example.com';
            const storedCode = sessionStorage.getItem('verifyCode') || '123456'; // Default for demo
            const storedExpiry = parseInt(sessionStorage.getItem('verifyExpiry')) || (Date.now() + TOTAL_SECONDS * 1000);

            document.getElementById('userEmail').textContent = storedEmail;

            // ========== CODE INPUT HANDLING ==========
            const inputs = document.querySelectorAll('.code-input');
            
            inputs.forEach((input, idx) => {
                // Auto-focus next input
                input.addEventListener('input', (e) => {
                    const val = e.target.value;
                    // Only allow numbers
                    if (!/^\d$/.test(val)) {
                        e.target.value = '';
                        return;
                    }
                    input.classList.add('filled');
                    input.classList.remove('error');
                    if (idx < inputs.length - 1 && val) {
                        inputs[idx + 1].focus();
                    }
                    // Auto-verify when all 6 digits entered
                    if (getCode().length === 6) {
                        verifyCode();
                    }
                });

                // Handle backspace
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !input.value && idx > 0) {
                        inputs[idx - 1].focus();
                        inputs[idx - 1].classList.remove('filled');
                    }
                });

                // Handle paste
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pasted = (e.clipboardData || window.clipboardData).getData('text');
                    const numbers = pasted.replace(/\D/g, '').slice(0, 6);
                    numbers.split('').forEach((num, i) => {
                        if (inputs[i]) {
                            inputs[i].value = num;
                            inputs[i].classList.add('filled');
                        }
                    });
                    if (numbers.length === 6) {
                        inputs[5].focus();
                        verifyCode();
                    }
                });
            });

            function getCode() {
                return Array.from(inputs).map(i => i.value).join('');
            }

            // ========== TIMER ==========
            function startTimer() {
                timeLeft = Math.max(0, Math.floor((storedExpiry - Date.now()) / 1000));
                updateTimerDisplay();
                
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    timeLeft--;
                    updateTimerDisplay();
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        handleExpiry();
                    }
                }, 1000);
            }

            function updateTimerDisplay() {
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                document.getElementById('timerMinutes').textContent = String(mins).padStart(2, '0');
                document.getElementById('timerSeconds').textContent = String(secs).padStart(2, '0');
                
                const timerEl = document.getElementById('timer');
                if (timeLeft <= 60) {
                    timerEl.classList.add('expired');
                    timerEl.innerHTML = '⚠️ Code expires in <strong>' + mins + ':' + String(secs).padStart(2, '0') + '</strong>';
                }
                if (timeLeft <= 0) {
                    timerEl.classList.add('expired');
                    timerEl.textContent = '❌ Code has expired';
                }
            }

            function handleExpiry() {
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('errorMessage').textContent = 'Verification code has expired. Please request a new one.';
                document.getElementById('verifyBtn').disabled = true;
                inputs.forEach(i => { i.disabled = true; i.classList.add('error'); });
                document.getElementById('resendBtn').disabled = false;
                document.getElementById('resendBtn').textContent = 'Request New Code';
            }

            // ========== VERIFY CODE ==========
            window.verifyCode = function() {
                const enteredCode = getCode();
                const errorEl = document.getElementById('errorMessage');
                const successEl = document.getElementById('successMessage');
                const btn = document.getElementById('verifyBtn');
                const spinner = document.getElementById('verifySpinner');

                errorEl.style.display = 'none';
                successEl.style.display = 'none';

                if (enteredCode.length !== 6) {
                    errorEl.style.display = 'block';
                    errorEl.textContent = 'Please enter the complete 6‑digit code.';
                    shakeInputs();
                    return;
                }

                if (timeLeft <= 0) {
                    handleExpiry();
                    return;
                }

                // Show loading
                btn.disabled = true;
                spinner.style.display = 'inline-block';
                btn.innerHTML = '<span class="spinner" style="display:inline-block;"></span> Verifying...';

                // Simulate API verification
                setTimeout(() => {
                    if (enteredCode === storedCode) {
                        // Success
                        successEl.style.display = 'block';
                        successEl.textContent = '✅ Email verified successfully! Redirecting...';
                        inputs.forEach(i => i.classList.add('filled'));
                        
                        // Store verified status
                        sessionStorage.setItem('emailVerified', 'true');
                        sessionStorage.removeItem('verifyCode');
                        sessionStorage.removeItem('verifyExpiry');
                        sessionStorage.removeItem('verifyEmail');

                        // Simulate setting auth token
                        const token = 'token_' + Math.random().toString(36).substr(2);
                        sessionStorage.setItem('authToken', token);
                        sessionStorage.setItem('userEmail', storedEmail);

                        // Redirect to client portal
                        setTimeout(() => {
                            window.location.href = '/client-portal/dashboard/';
                        }, 1500);
                    } else {
                        // Failed
                        errorEl.style.display = 'block';
                        errorEl.textContent = 'Invalid code. Please try again.';
                        inputs.forEach(i => i.classList.add('error'));
                        shakeInputs();
                        
                        // Reset button
                        btn.disabled = false;
                        spinner.style.display = 'none';
                        btn.innerHTML = '<span class="spinner"></span> Verify Email';
                        
                        // Clear inputs after 1 second
                        setTimeout(() => {
                            inputs.forEach(i => { i.value = ''; i.classList.remove('error', 'filled'); });
                            inputs[0].focus();
                        }, 1000);
                    }
                }, 1000);
            };

            function shakeInputs() {
                document.getElementById('codeContainer').style.animation = 'shake 0.4s';
                setTimeout(() => {
                    document.getElementById('codeContainer').style.animation = '';
                }, 400);
            }

            // ========== RESEND CODE ==========
            window.resendCode = function() {
                const resendBtn = document.getElementById('resendBtn');
                resendBtn.disabled = true;
                resendBtn.textContent = 'Sending...';

                // Simulate API call
                setTimeout(() => {
                    // Generate new code and expiry
                    const newCode = String(Math.floor(100000 + Math.random() * 900000));
                    const newExpiry = Date.now() + TOTAL_SECONDS * 1000;
                    
                    sessionStorage.setItem('verifyCode', newCode);
                    sessionStorage.setItem('verifyExpiry', newExpiry.toString());
                    
                    // Reset timer
                    timeLeft = TOTAL_SECONDS;
                    updateTimerDisplay();
                    document.getElementById('timer').classList.remove('expired');
                    document.getElementById('errorMessage').style.display = 'none';
                    document.getElementById('verifyBtn').disabled = false;
                    inputs.forEach(i => { i.disabled = false; i.value = ''; i.classList.remove('error', 'filled'); });
                    inputs[0].focus();

                    // Show success
                    document.getElementById('successMessage').style.display = 'block';
                    document.getElementById('successMessage').textContent = '📩 New code sent! Check your email.';
                    
                    // Start resend cooldown
                    resendCooldown = RESEND_COOLDOWN;
                    resendBtn.textContent = 'Resend in ' + resendCooldown + 's';
                    if (resendInterval) clearInterval(resendInterval);
                    resendInterval = setInterval(() => {
                        resendCooldown--;
                        if (resendCooldown <= 0) {
                            clearInterval(resendInterval);
                            resendBtn.disabled = false;
                            resendBtn.textContent = 'Resend Code';
                        } else {
                            resendBtn.textContent = 'Resend in ' + resendCooldown + 's';
                        }
                    }, 1000);
                }, 800);
            };

            // ========== INIT ==========
            startTimer();
            inputs[0].focus();

            // Start resend cooldown on load
            resendCooldown = RESEND_COOLDOWN;
            document.getElementById('resendBtn').textContent = 'Resend in ' + resendCooldown + 's';
            resendInterval = setInterval(() => {
                resendCooldown--;
                if (resendCooldown <= 0) {
                    clearInterval(resendInterval);
                    document.getElementById('resendBtn').disabled = false;
                    document.getElementById('resendBtn').textContent = 'Resend Code';
                } else {
                    document.getElementById('resendBtn').textContent = 'Resend in ' + resendCooldown + 's';
                }
            }, 1000);
        })();
    </script>
</body>
</html>
