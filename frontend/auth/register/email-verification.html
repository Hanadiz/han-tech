<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email | Han-Tech Ltd</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0f1a, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .verify-card {
            background: #fff;
            border-radius: 24px;
            padding: 50px 40px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        [data-theme="dark"] .verify-card { background: #1a1a2e; }
        .verify-icon { font-size: 4rem; color: #0077b6; margin-bottom: 20px; }
        h2 { font-family: 'Poppins', sans-serif; font-weight: 700; }
        .email-highlight {
            font-weight: 600;
            color: #0077b6;
            background: rgba(0,119,182,0.1);
            padding: 2px 10px;
            border-radius: 6px;
        }
        .code-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 30px 0;
        }
        .code-input {
            width: 52px;
            height: 60px;
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
            background: #f9fafb;
            color: #2c3e50;
            transition: 0.3s;
        }
        [data-theme="dark"] .code-input {
            background: #0f0f1a;
            border-color: #2a2a40;
            color: #e0e0e0;
        }
        .code-input:focus { border-color: #00b4d8; box-shadow: 0 0 0 4px rgba(0,180,216,0.1); outline: none; }
        .btn-verify {
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            color: #fff;
            border: none;
            padding: 14px 36px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            cursor: pointer;
        }
        .btn-verify:disabled { opacity: 0.5; cursor: not-allowed; }
        .timer { font-size: 0.9rem; color: #f39c12; font-weight: 600; margin: 15px 0; }
        .error-message { color: #e74c3c; font-size: 0.85rem; margin-top: 10px; display: none; }
        .success-message { color: #2ecc71; font-size: 0.85rem; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="verify-card">
        <div class="verify-icon"><i class="bi bi-envelope-check"></i></div>
        <h2>Verify Your Email</h2>
        <p>We sent a 6‑digit code to <span class="email-highlight" id="userEmail">your email</span></p>
        <p class="text-muted small">The code expires in <strong>5 minutes</strong></p>

        <div class="code-container" id="codeContainer">
            <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
            <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
            <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
            <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
            <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
            <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
        </div>

        <div class="timer">⏱ Code expires in <strong id="timerMinutes">5</strong>:<strong id="timerSeconds">00</strong></div>
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
        <button class="btn-verify" id="verifyBtn">Verify Email</button>
        <div class="mt-3">
            <span class="text-muted small">Didn't receive the code?</span>
            <button class="btn btn-link p-0" id="resendBtn" disabled>Resend Code</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function() {
            const email = sessionStorage.getItem('verifyEmail') || 'user@example.com';
            document.getElementById('userEmail').textContent = email;

            const inputs = document.querySelectorAll('.code-input');
            inputs.forEach((input, idx) => {
                input.addEventListener('input', (e) => {
                    if (!/^\d$/.test(e.target.value)) { e.target.value = ''; return; }
                    if (idx < inputs.length - 1 && e.target.value) inputs[idx + 1].focus();
                });
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !input.value && idx > 0) inputs[idx - 1].focus();
                });
            });

            // Timer (5 minutes)
            let timeLeft = 300;
            const timerMins = document.getElementById('timerMinutes');
            const timerSecs = document.getElementById('timerSeconds');
            const verifyBtn = document.getElementById('verifyBtn');
            const timerInterval = setInterval(() => {
                timeLeft--;
                timerMins.textContent = String(Math.floor(timeLeft / 60)).padStart(2, '0');
                timerSecs.textContent = String(timeLeft % 60).padStart(2, '0');
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    verifyBtn.disabled = true;
                    document.getElementById('errorMessage').textContent = 'Code expired. Please resend.';
                    document.getElementById('errorMessage').style.display = 'block';
                    document.getElementById('resendBtn').disabled = false;
                }
            }, 1000);

            verifyBtn.addEventListener('click', () => {
                const code = Array.from(inputs).map(i => i.value).join('');
                if (code.length !== 6) {
                    document.getElementById('errorMessage').textContent = 'Enter the 6‑digit code.';
                    document.getElementById('errorMessage').style.display = 'block';
                    return;
                }
                // Simulate verification
                document.getElementById('successMessage').textContent = '✅ Email verified!';
                document.getElementById('successMessage').style.display = 'block';
                verifyBtn.disabled = true;
                clearInterval(timerInterval);
                // Role-based redirect
                const role = sessionStorage.getItem('verifyRole') || 'client';
                const portals = {
                    client: '/client-portal/dashboard/',
                    admin: '/admin/dashboard/',
                    super_admin: '/super-admin/dashboard/',
                    support_agent: '/support-agent/dashboard/',
                    sales_rep: '/sales-rep/dashboard/',
                    technical_engineer: '/technical-engineer/dashboard/',
                    course_instructor: '/course-instructor/dashboard/',
                    finance_officer: '/finance-officer/dashboard/',
                    content_manager: '/content-manager/dashboard/'
                };
                setTimeout(() => {
                    window.location.href = portals[role] || '/client-portal/dashboard/';
                }, 1500);
            });
        })();
    </script>
</body>
</html>
