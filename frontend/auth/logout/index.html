<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout | Han-Tech Ltd</title>
    <!-- Security headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --tech-blue: #0077b6; --gradient-tech: linear-gradient(135deg, #0077b6, #00b4d8); }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0f0f1a, #1a1a2e, #16213e); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .logout-container { background: #fff; border-radius: 24px; padding: 50px 40px; width: 100%; max-width: 480px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.3); }
        [data-theme="dark"] .logout-container { background: #1a1a2e; }
        .logout-icon { font-size: 4rem; color: #0077b6; margin-bottom: 20px; }
        h2 { font-family: 'Poppins', sans-serif; font-weight: 700; color: #2c3e50; margin-bottom: 10px; }
        [data-theme="dark"] h2 { color: #e0e0e0; }
        p { color: #666; margin-bottom: 30px; }
        [data-theme="dark"] p { color: #94a3b8; }
        .btn-group-custom { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn-logout { background: #e74c3c; color: #fff; border: none; padding: 14px 36px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-logout:hover { background: #c0392b; transform: translateY(-1px); }
        .btn-logout:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-cancel { background: #f0f0f0; color: #333; border: none; padding: 14px 36px; border-radius: 12px; font-weight: 600; text-decoration: none; transition: 0.3s; display: inline-block; }
        [data-theme="dark"] .btn-cancel { background: #2a2a40; color: #ccc; }
        .btn-cancel:hover { background: #e0e0e0; }
        .btn-login-again { background: var(--gradient-tech); color: #fff; border: none; padding: 14px 36px; border-radius: 12px; font-weight: 600; text-decoration: none; transition: 0.3s; display: inline-block; }
        .btn-login-again:hover { opacity: 0.9; transform: translateY(-1px); }
        .spinner { display: none; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .countdown-text { font-size: 0.9rem; color: #666; margin-top: 20px; display: none; }
        .session-info { background: #f9fafb; border-radius: 12px; padding: 15px; margin-bottom: 25px; font-size: 0.9rem; }
        [data-theme="dark"] .session-info { background: #0f0f1a; }
        .session-info i { color: #0077b6; margin-right: 6px; }
    </style>
</head>
<body>
    <div class="logout-container" id="logoutContainer">
        <!-- Pre-logout state -->
        <div id="preLogout">
            <div class="logout-icon">
                <i class="bi bi-box-arrow-right"></i>
            </div>
            <h2>Sign Out</h2>
            <p>Are you sure you want to sign out of your Han‑Tech account?</p>
            <div class="session-info text-start">
                <div><i class="bi bi-person"></i> <strong id="sessionUser">user@example.com</strong></div>
                <div class="mt-1"><i class="bi bi-clock"></i> Session started: <span id="sessionStart">-</span></div>
                <div class="mt-1"><i class="bi bi-shield-check"></i> Active devices: <span id="activeDevices">1</span></div>
            </div>
            <div class="form-check mb-3 text-start">
                <input type="checkbox" class="form-check-input" id="logoutAllDevices">
                <label class="form-check-label" for="logoutAllDevices">Sign out of all devices</label>
            </div>
            <div class="btn-group-custom">
                <button class="btn-logout" id="logoutBtn" onclick="performLogout()">
                    <span class="spinner" id="logoutSpinner"></span>
                    Sign Out
                </button>
                <a href="javascript:history.back()" class="btn-cancel">Cancel</a>
            </div>
            <div class="countdown-text" id="countdownText">Redirecting in <span id="countdown">5</span> seconds...</div>
        </div>

        <!-- Post-logout state (hidden initially) -->
        <div id="postLogout" style="display: none;">
            <div class="logout-icon">
                <i class="bi bi-check-circle-fill" style="color: #2ecc71;"></i>
            </div>
            <h2>Signed Out Successfully</h2>
            <p>You have been securely signed out. All session tokens have been invalidated.</p>
            <div class="btn-group-custom">
                <a href="/auth/login/index.html" class="btn-login-again">Sign In Again</a>
                <a href="/index.html" class="btn-cancel">Go to Home</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function() {
            // --- Simulate reading session data ---
            const userEmail = sessionStorage.getItem('userEmail') || 
                            localStorage.getItem('userEmail') || 
                            'user@example.com';
            const sessionStartTime = sessionStorage.getItem('sessionStart') || 
                                    new Date(Date.now() - 3600000).toLocaleString(); // 1 hour ago
            
            document.getElementById('sessionUser').textContent = userEmail;
            document.getElementById('sessionStart').textContent = sessionStartTime;

            // Store session data for demo (would be set at login)
            if (!sessionStorage.getItem('sessionStart')) {
                sessionStorage.setItem('sessionStart', new Date().toLocaleString());
                sessionStorage.setItem('userEmail', userEmail);
            }

            // --- Perform logout ---
            window.performLogout = function() {
                const logoutBtn = document.getElementById('logoutBtn');
                const spinner = document.getElementById('logoutSpinner');
                const logoutAll = document.getElementById('logoutAllDevices').checked;

                // Disable button, show spinner
                logoutBtn.disabled = true;
                spinner.style.display = 'inline-block';
                logoutBtn.innerHTML = '<span class="spinner" style="display:inline-block;"></span> Signing Out...';

                // Clear all auth-related storage
                const keysToRemove = [
                    'authToken',
                    'refreshToken',
                    'csrfToken',
                    'userEmail',
                    'userName',
                    'userRole',
                    'sessionStart',
                    'sessionId',
                    'loginAttempts',
                    'loginLockout',
                    'rememberMe',
                    'cartCount',
                    'preferences'
                ];

                // Clear sessionStorage
                keysToRemove.forEach(key => {
                    try { sessionStorage.removeItem(key); } catch(e) {}
                });

                // If "logout all devices" checked, also clear localStorage tokens
                if (logoutAll) {
                    keysToRemove.forEach(key => {
                        try { localStorage.removeItem(key); } catch(e) {}
                    });
                    // Clear all localStorage (use with caution)
                    // localStorage.clear();
                } else {
                    // Only remove session-specific localStorage items
                    try { localStorage.removeItem('authToken'); } catch(e) {}
                    try { localStorage.removeItem('refreshToken'); } catch(e) {}
                }

                // Clear cookies (simulated - real implementation would use HttpOnly cookies)
                document.cookie.split(';').forEach(cookie => {
                    const name = cookie.split('=')[0].trim();
                    document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                });

                // Simulate API call delay
                setTimeout(() => {
                    // Hide pre-logout, show post-logout
                    document.getElementById('preLogout').style.display = 'none';
                    document.getElementById('postLogout').style.display = 'block';

                    // Show countdown and auto-redirect
                    const countdownEl = document.getElementById('countdownText');
                    countdownEl.style.display = 'block';
                    let seconds = 5;
                    const countdownInterval = setInterval(() => {
                        seconds--;
                        document.getElementById('countdown').textContent = seconds;
                        if (seconds <= 0) {
                            clearInterval(countdownInterval);
                            window.location.href = '/index.html';
                        }
                    }, 1000);
                }, 800); // Simulate network delay
            };

            // --- Prevent back button after logout ---
            if (window.history && window.history.pushState) {
                window.history.pushState('logout', null, window.location.href);
                window.addEventListener('popstate', function() {
                    window.history.pushState('logout', null, window.location.href);
                });
            }

            // --- Clear sensitive data from memory ---
            window.addEventListener('beforeunload', function() {
                // Any additional cleanup before leaving
                console.log('Logout page unloaded - session cleared');
            });

            // --- Security: Disable caching ---
            // Already set via meta tags at top
        })();
    </script>
</body>
</html>
