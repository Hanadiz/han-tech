<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources | Han-Tech Incubation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f9fafb; color: #2c3e50; }
        .page-hero { background: linear-gradient(135deg, #0f0f1a, #1a1a2e, #16213e); color: #fff; padding: 100px 0 60px; text-align: center; }
        .page-hero h1 { font-family: 'Poppins', sans-serif; font-size: 3rem; font-weight: 700; }
        .resource-card { background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); height: 100%; text-align: center; }
        [data-theme="dark"] .resource-card { background: #1a1a2e; }
        .resource-card i { font-size: 2.5rem; color: #00b4d8; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div id="header-container"></div>

    <section class="page-hero"><div class="container"><h1>Resources</h1><p>Templates, guides, and tools for your startup journey</p></div></section>

    <section class="container py-5">
        <div class="row g-4">
            <div class="col-md-4"><div class="resource-card"><i class="fas fa-file-alt"></i><h5>Business Plan Template</h5><a href="#" class="btn btn-outline-primary btn-sm mt-2">Download</a></div></div>
            <div class="col-md-4"><div class="resource-card"><i class="fas fa-chart-pie"></i><h5>Pitch Deck Guide</h5><a href="#" class="btn btn-outline-primary btn-sm mt-2">Download</a></div></div>
            <div class="col-md-4"><div class="resource-card"><i class="fas fa-balance-scale"></i><h5>Legal Checklist</h5><a href="#" class="btn btn-outline-primary btn-sm mt-2">Download</a></div></div>
        </div>
    </section>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function load(u,i){ try{const r=await fetch(u);document.getElementById(i).innerHTML=await r.text()}catch(e){} }
        load('/components/layouts/header.html','header-container');
        load('/components/layouts/footer.html','footer-container');
    </script>
</body>
</html>
