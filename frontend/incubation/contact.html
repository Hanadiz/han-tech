<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Incubation | Han-Tech Ltd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f9fafb; color: #2c3e50; }
        .page-hero { background: linear-gradient(135deg, #0f0f1a, #1a1a2e, #16213e); color: #fff; padding: 100px 0 60px; text-align: center; }
        .page-hero h1 { font-family: 'Poppins', sans-serif; font-size: 3rem; font-weight: 700; }
        .contact-section { padding: 60px 0; text-align: center; }
        .btn-custom { background: linear-gradient(135deg, #0077b6, #00b4d8); color: #fff; padding: 14px 36px; border-radius: 50px; font-weight: 600; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
    <div id="header-container"></div>

    <section class="page-hero"><div class="container"><h1>Contact the Incubation Team</h1><p>We'd love to hear from you</p></div></section>

    <section class="contact-section container">
        <h4>📧 incubation@hantech.com</h4>
        <p class="mt-3">📍 Yumbe, Uganda</p>
        <a href="mailto:incubation@hantech.com" class="btn-custom mt-4">Email Us</a>
    </section>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function load(u,i){ try{const r=await fetch(u);document.getElementById(i).innerHTML=await r.text()}catch(e){} }
        load('/components/layouts/header.html','header-container');
        load('/components/layouts/footer.html','footer-container');
    </script>
</body>
</html>
