<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startups | Han-Tech Incubation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f9fafb; color: #2c3e50; }
        .page-hero { background: linear-gradient(135deg, #0f0f1a, #1a1a2e, #16213e); color: #fff; padding: 100px 0 60px; text-align: center; }
        .page-hero h1 { font-family: 'Poppins', sans-serif; font-size: 3rem; font-weight: 700; }
        .startup-card { background: #fff; border-radius: 16px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; display: flex; align-items: center; gap: 20px; }
        [data-theme="dark"] .startup-card { background: #1a1a2e; }
        .startup-card img { width: 80px; height: 80px; border-radius: 16px; object-fit: cover; }
        .startup-card h5 { font-family: 'Poppins', sans-serif; font-weight: 600; margin: 0; }
    </style>
</head>
<body>
    <div id="header-container"></div>

    <section class="page-hero"><div class="container"><h1>Our Startups</h1><p>Meet the ventures we're helping grow</p></div></section>

    <section class="container py-5">
        <div class="startup-card"><img src="https://via.placeholder.com/80?text=A" alt=""><div><h5>AgriSense</h5><p>IoT soil monitoring for smallholder farmers.</p></div></div>
        <div class="startup-card"><img src="https://via.placeholder.com/80?text=B" alt=""><div><h5>EduConnect</h5><p>Offline‑first LMS for rural schools.</p></div></div>
        <div class="startup-card"><img src="https://via.placeholder.com/80?text=C" alt=""><div><h5>PayLocal</h5><p>Mobile money gateway for SMEs.</p></div></div>
    </section>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function load(u,i){ try{const r=await fetch(u);document.getElementById(i).innerHTML=await r.text()}catch(e){} }
        load('/components/layouts/header.html','header-container');
        load('/components/layouts/footer.html','footer-container');
    </script>
</body>
</html>
