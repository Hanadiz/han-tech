<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentors | Han-Tech Incubation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f9fafb; color: #2c3e50; }
        .page-hero { background: linear-gradient(135deg, #0f0f1a, #1a1a2e, #16213e); color: #fff; padding: 100px 0 60px; text-align: center; }
        .page-hero h1 { font-family: 'Poppins', sans-serif; font-size: 3rem; font-weight: 700; }
        .mentor-card { background: #fff; border-radius: 20px; padding: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; transition: 0.3s; height: 100%; }
        [data-theme="dark"] .mentor-card { background: #1a1a2e; }
        .mentor-card:hover { transform: translateY(-5px); }
        .mentor-card img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #00b4d8; margin-bottom: 15px; }
        .mentor-card h5 { font-family: 'Poppins', sans-serif; font-weight: 600; }
        .mentor-card small { color: #00b4d8; display: block; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div id="header-container"></div>

    <section class="page-hero"><div class="container"><h1>Our Mentors</h1><p>Learn from industry leaders and successful entrepreneurs</p></div></section>

    <section class="container py-5">
        <div class="row g-4">
            <div class="col-md-4"><div class="mentor-card"><img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?w=200" alt=""><h5>John Opio</h5><small>CEO, Han-Tech Ltd</small><p>Expert in scaling tech businesses in East Africa.</p></div></div>
            <div class="col-md-4"><div class="mentor-card"><img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=200" alt=""><h5>Sarah Namukasa</h5><small>CTO, Han-Tech Ltd</small><p>Cloud architecture and product development.</p></div></div>
            <div class="col-md-4"><div class="mentor-card"><img src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=200" alt=""><h5>David Kato</h5><small>COO, Han-Tech Ltd</small><p>Operations and go‑to‑market strategy.</p></div></div>
        </div>
    </section>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function load(u,i){ try{const r=await fetch(u);document.getElementById(i).innerHTML=await r.text()}catch(e){} }
        load('/components/layouts/header.html','header-container');
        load('/components/layouts/footer.html','footer-container');
    </script>
</body>
</html>
