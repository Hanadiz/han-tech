<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply | Han-Tech Incubation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f9fafb; color: #2c3e50; }
        .page-hero { background: linear-gradient(135deg, #0f0f1a, #1a1a2e, #16213e); color: #fff; padding: 100px 0 60px; text-align: center; }
        .page-hero h1 { font-family: 'Poppins', sans-serif; font-size: 3rem; font-weight: 700; }
        .form-section { padding: 80px 0; max-width: 700px; margin: 0 auto; }
        .form-control { border-radius: 12px; padding: 12px 18px; border: 2px solid #e0e0e0; }
        [data-theme="dark"] .form-control { background: #1a1a2e; border-color: #2a2a40; color: #e0e0e0; }
        .btn-submit { background: linear-gradient(135deg, #0077b6, #00b4d8); color: #fff; border: none; padding: 14px 36px; border-radius: 50px; font-weight: 600; width: 100%; }
    </style>
</head>
<body>
    <div id="header-container"></div>

    <section class="page-hero">
        <div class="container">
            <h1>Apply to the Incubation Hub</h1>
            <p>Tell us about your startup and we'll be in touch within 5 business days.</p>
        </div>
    </section>

    <section class="form-section container">
        <form>
            <div class="mb-3"><label>Startup Name</label><input type="text" class="form-control" placeholder="Your startup name"></div>
            <div class="mb-3"><label>Founder(s) Full Name</label><input type="text" class="form-control" placeholder="Your name"></div>
            <div class="mb-3"><label>Email</label><input type="email" class="form-control" placeholder="you@example.com"></div>
            <div class="mb-3"><label>Phone</label><input type="tel" class="form-control" placeholder="+256..."></div>
            <div class="mb-3"><label>Stage</label>
                <select class="form-control"><option>Idea Stage</option><option>MVP Ready</option><option>Early Revenue</option><option>Growth Stage</option></select>
            </div>
            <div class="mb-3"><label>Pitch (brief description)</label><textarea class="form-control" rows="4" placeholder="What problem are you solving?"></textarea></div>
            <button type="submit" class="btn-submit">Submit Application</button>
        </form>
    </section>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function load(u,i){ try{const r=await fetch(u);document.getElementById(i).innerHTML=await r.text()}catch(e){} }
        load('/components/layouts/header.html','header-container');
        load('/components/layouts/footer.html','footer-container');
    </script>
</body>
</html>
