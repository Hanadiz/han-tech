<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply | Han-Tech Incubation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; margin: 0; }
        .form-card { max-width: 700px; margin: 40px auto; background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        [data-theme="dark"] .form-card { background: #1a1a2e; }
        .btn-apply { background: linear-gradient(135deg, #0077b6, #00b4d8); color: #fff; border: none; padding: 14px 36px; border-radius: 12px; font-weight: 600; }
    </style>
</head>
<body>
    <div id="header-container"></div>
    <div id="inc-header-container"></div>

    <div class="form-card">
        <h2 class="text-center mb-4" style="font-family:'Poppins',sans-serif;">Apply to the Incubation Hub</h2>
        <form>
            <div class="mb-3"><label>Startup Name</label><input type="text" class="form-control"></div>
            <div class="mb-3"><label>Founder(s) Name</label><input type="text" class="form-control"></div>
            <div class="mb-3"><label>Email</label><input type="email" class="form-control"></div>
            <div class="mb-3"><label>Pitch (brief)</label><textarea class="form-control" rows="4"></textarea></div>
            <button type="submit" class="btn-apply w-100">Submit Application</button>
        </form>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function load(url, id) { try { const r = await fetch(url); document.getElementById(id).innerHTML = await r.text(); } catch(e) {} }
        load('/components/layouts/header.html', 'header-container');
        load('/incubation/header.html', 'inc-header-container');
        load('/components/layouts/footer.html', 'footer-container');
    </script>
</body>
</html>
