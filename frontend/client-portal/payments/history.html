 <!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment History | Han-Tech Ltd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f5f7fa; margin: 0; }
        [data-theme="dark"] body { background: #0f0f1a; color: #e0e0e0; }
        .client-layout { display: flex; min-height: calc(100vh - 140px); }
        .client-main { flex: 1; padding: 30px; background: #f5f7fa; }
        [data-theme="dark"] .client-main { background: #0f0f1a; }
        .payment-row { background: #fff; border-radius: 12px; padding: 15px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        [data-theme="dark"] .payment-row { background: #1a1a2e; }
        .badge-completed { background: #d4edda; color: #155724; }
        .badge-pending { background: #fff3cd; color: #856404; }
    </style>
</head>
<body>
    <div id="header-container"></div>
    <div class="client-layout">
        <div id="sidebar-container"></div>
        <main class="client-main">
            <h3 style="font-family:'Poppins',sans-serif;"><i class="bi bi-clock-history me-2"></i>Payment History</h3>
            <div class="payment-row">
                <div><strong>$499.00</strong> · Invoice #INV-2025-06</div>
                <div><span class="badge badge-completed">Completed</span><br><small class="text-muted">Jun 1, 2025</small></div>
            </div>
            <div class="payment-row">
                <div><strong>$299.00</strong> · Invoice #INV-2025-05</div>
                <div><span class="badge badge-completed">Completed</span><br><small class="text-muted">May 1, 2025</small></div>
            </div>
            <div class="payment-row">
                <div><strong>$199.00</strong> · Invoice #INV-2025-07</div>
                <div><span class="badge badge-pending">Pending</span><br><small class="text-muted">Due Jul 1</small></div>
            </div>
        </main>
    </div>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/client-portal/auth-guard.js"></script>
    <script>
        (function() {
            if (!AuthGuard.check()) return;
            async function load(u,i) { try { const r = await fetch(u); document.getElementById(i).innerHTML = await r.text(); } catch(e) {} }
            load('/components/layouts/header.html','header-container');
            load('/components/layouts/sidebar-client.html','sidebar-container');
            load('/components/layouts/footer.html','footer-container');
        })();
    </script>
</body>
</html>
