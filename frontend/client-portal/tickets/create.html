<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Ticket | Han-Tech Ltd</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f5f7fa; }
        .form-card { max-width: 600px; margin: 60px auto; background: #fff; border-radius: 18px; padding: 35px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        [data-theme="dark"] .form-card { background: #1a1a2e; }
        h3 { font-family: 'Poppins', sans-serif; font-weight: 700; }
        .form-control, .form-select { border-radius: 12px; padding: 12px 16px; border: 2px solid #e0e0e0; }
        [data-theme="dark"] .form-control, [data-theme="dark"] .form-select { background: #0f0f1a; border-color: #2a2a40; color: #e0e0e0; }
        .btn-submit { background: linear-gradient(135deg, #0077b6, #00b4d8); color: #fff; border: none; padding: 14px 30px; border-radius: 12px; font-weight: 600; width: 100%; }
    </style>
</head>
<body>
    <div id="header-container"></div>
    <div class="form-card">
        <h3>Create Support Ticket</h3>
        <form id="ticketForm">
            <input type="hidden" id="csrfToken">
            <div class="mb-3"><label>Subject</label><input type="text" class="form-control" required></div>
            <div class="mb-3"><label>Category</label><select class="form-select"><option>Technical</option><option>Billing</option><option>General</option></select></div>
            <div class="mb-3"><label>Priority</label><select class="form-select"><option>Low</option><option selected>Medium</option><option>High</option><option>Urgent</option></select></div>
            <div class="mb-3"><label>Description</label><textarea class="form-control" rows="5" required></textarea></div>
            <button type="submit" class="btn-submit">Submit Ticket</button>
        </form>
    </div>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/client-portal/auth-guard.js"></script>
    <script>
        (function(){if(!AuthGuard.check())return;
        document.getElementById('csrfToken').value=Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,'0')).join('');
        document.getElementById('ticketForm').addEventListener('submit',function(e){e.preventDefault();alert('Ticket submitted! We will respond within 2 hours.');window.location.href='index.html'});
        async function load(u,i){try{const r=await fetch(u);document.getElementById(i).innerHTML=await r.text()}catch(e){}}load('/components/layouts/header.html','header-container');load('/components/layouts/footer.html','footer-container');})();
    </script>
</body>
</html>
