 <!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback | Han-Tech Ltd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f5f7fa; }
        .form-card { max-width: 550px; margin: 60px auto; background: #fff; border-radius: 20px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        [data-theme="dark"] .form-card { background: #1a1a2e; }
        .btn-submit { background: linear-gradient(135deg, #0077b6, #00b4d8); color: #fff; border: none; padding: 12px; border-radius: 12px; width: 100%; }
        .nps-grid { display: flex; justify-content: space-between; gap: 8px; margin: 15px 0; }
        .nps-btn { flex: 1; padding: 10px; border-radius: 8px; border: 2px solid #e0e0e0; background: #fff; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .nps-btn:hover { border-color: #0077b6; background: #f0f8ff; }
        .nps-btn.selected { border-color: #0077b6; background: #0077b6; color: #fff; }
    </style>
</head>
<body>
    <div id="header-container"></div>
    <div class="form-card">
        <h3>Share Your Feedback</h3>
        <label>How likely are you to recommend us?</label>
        <div class="nps-grid" id="npsGrid">
            <button class="nps-btn" data-nps="1">1</button><button class="nps-btn" data-nps="2">2</button><button class="nps-btn" data-nps="3">3</button>
            <button class="nps-btn" data-nps="4">4</button><button class="nps-btn" data-nps="5">5</button><button class="nps-btn" data-nps="6">6</button>
            <button class="nps-btn" data-nps="7">7</button><button class="nps-btn" data-nps="8">8</button><button class="nps-btn" data-nps="9">9</button>
            <button class="nps-btn" data-nps="10">10</button>
        </div>
        <textarea class="form-control mt-3 mb-3" rows="3" placeholder="Additional comments..."></textarea>
        <button class="btn-submit" onclick="submitFeedback()">Submit Feedback</button>
    </div>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/client-portal/auth-guard.js"></script>
    <script>
        (function(){
            if(!AuthGuard.check())return;
            let selectedNps = 0;
            document.getElementById('npsGrid').addEventListener('click', function(e){
                if(e.target.classList.contains('nps-btn')){
                    document.querySelectorAll('.nps-btn').forEach(b=>b.classList.remove('selected'));
                    e.target.classList.add('selected');
                    selectedNps = parseInt(e.target.dataset.nps);
                }
            });
            window.submitFeedback = function(){ alert('Thank you for your feedback!'); window.location.href='thank-you.html'; };
            async function load(u,i){try{const r=await fetch(u);document.getElementById(i).innerHTML=await r.text()}catch(e){}} load('/components/layouts/header.html','header-container'); load('/components/layouts/footer.html','footer-container');
        })();
    </script>
</body>
</html>
