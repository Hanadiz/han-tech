 <!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | Han-Tech Ltd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f5f7fa; margin: 0; }
        [data-theme="dark"] body { background: #0f0f1a; color: #e0e0e0; }
        .client-layout { display: flex; min-height: calc(100vh - 140px); }
        .client-main { flex: 1; padding: 30px; background: #f5f7fa; }
        [data-theme="dark"] .client-main { background: #0f0f1a; }
        .notif-item { background: #fff; border-radius: 12px; padding: 15px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); margin-bottom: 10px; display: flex; align-items: center; gap: 15px; cursor: pointer; }
        [data-theme="dark"] .notif-item { background: #1a1a2e; }
        .notif-item.unread { border-left: 4px solid #0077b6; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-info { background: #3498db; }
        .dot-success { background: #2ecc71; }
        .dot-warning { background: #f39c12; }
        .dot-danger { background: #e74c3c; }
        .notif-time { color: #888; font-size: 0.8rem; white-space: nowrap; }
    </style>
</head>
<body>
    <div id="header-container"></div>
    <div class="client-layout">
        <div id="sidebar-container"></div>
        <main class="client-main">
            <h3 style="font-family:'Poppins',sans-serif;"><i class="bi bi-bell me-2"></i>Notifications</h3>
            <div class="notif-item unread">
                <span class="dot dot-warning"></span>
                <div class="flex-grow-1"><strong>Invoice #INV-2025-07 due</strong><br><small>Your invoice of $499 is due on July 1.</small></div>
                <span class="notif-time">1h ago</span>
            </div>
            <div class="notif-item">
                <span class="dot dot-success"></span>
                <div class="flex-grow-1"><strong>Ticket #1000 resolved</strong><br><small>Your billing question has been resolved.</small></div>
                <span class="notif-time">1d ago</span>
            </div>
            <div class="notif-item">
                <span class="dot dot-danger"></span>
                <div class="flex-grow-1"><strong>Failed login attempt</strong><br><small>Someone tried to access your account from a new device.</small></div>
                <span class="notif-time">2d ago</span>
            </div>
        </main>
    </div>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/client-portal/auth-guard.js"></script>
    <script>
        (function() {
            if (!AuthGuard.check()) return;
            async function load(u,i) { try { const r = await fetch(u); document.getElementById(i).innerHTML = await r.text(); } catch(e) {} }
            load('/components/layouts/header.html','header-container');
            load('/components/layouts/sidebar-client.html','sidebar-container');
            load('/components/layouts/footer.html','footer-container');
        })();
    </script>
</body>
</html>
