 <!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Service Request | Han-Tech Ltd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f5f7fa; }
        .form-card { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        [data-theme="dark"] .form-card { background: #1a1a2e; }
        .btn-submit { background: linear-gradient(135deg, #0077b6, #00b4d8); color: #fff; border: none; padding: 12px; border-radius: 12px; width: 100%; }
    </style>
</head>
<body>
    <div id="header-container"></div>
    <div class="form-card">
        <h3>New Service Request</h3>
        <form id="srForm">
            <input type="hidden" id="csrfToken">
            <div class="mb-3"><label>Request Type</label><select class="form-select"><option>Upgrade Service</option><option>Downgrade Service</option><option>Add User</option><option>Configuration Change</option></select></div>
            <div class="mb-3"><label>Description</label><textarea class="form-control" rows="4"></textarea></div>
            <button type="submit" class="btn-submit">Submit Request</button>
        </form>
    </div>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/client-portal/auth-guard.js"></script>
    <script>
        (function(){
            if(!AuthGuard.check())return;
            document.getElementById('csrfToken').value = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,'0')).join('');
            document.getElementById('srForm').addEventListener('submit',function(e){e.preventDefault(); alert('Request submitted!'); window.location.href='index.html';});
            async function load(u,i){try{const r=await fetch(u);document.getElementById(i).innerHTML=await r.text()}catch(e){}} load('/components/layouts/header.html','header-container'); load('/components/layouts/footer.html','footer-container');
        })();
    </script>
</body>
</html>
