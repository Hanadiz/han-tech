
 <!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Detail | Han-Tech Ltd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background: #f5f7fa; }

<body>
    <div id="header-container"></div>

    <div id="footer-container"></div>

    <script src="/js/client-portal/auth-guard.js"></script>
    <script>(function(){ if(!AuthGuard.check())return; async function load(u,i){try{const r=await fetch(u);document.getElementById(i).innerHTML=await r.text()}catch(e){}} load('/components/layouts/header.html','header-container'); load('/components/layouts/footer.html','footer-container'); })();</script>
