 <!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Detail | Han-Tech Ltd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f5f7fa; color: #2c3e50; }
        [data-theme="dark"] body { background: #0f0f1a; color: #e0e0e0; }
        .detail-card { max-width: 700px; margin: 40px auto; background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        [data-theme="dark"] .detail-card { background: #1a1a2e; }
        .cert-header { background: linear-gradient(135deg, #9b59b6, #8e44ad); color: #fff; padding: 40px; text-align: center; }
        .cert-header h3 { font-family: 'Poppins', sans-serif; font-size: 1.8rem; font-weight: 700; }
        .cert-body { padding: 30px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .info-item { margin-bottom: 15px; }
        .info-label { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-download { background: #9b59b6; color: #fff; border: none; padding: 12px 30px; border-radius: 12px; font-weight: 600; }
        .btn-download:hover { background: #8e44ad; }
    </style>
</head>
<body>
    <div id="header-container"></div>

    <div class="detail-card">
        <div class="cert-header">
            <i class="bi bi-award-fill" style="font-size: 3rem;"></i>
            <h3 class="mt-3">Cloud Fundamentals</h3>
            <p>This certificate is presented to</p>
            <h4 id="recipientName">John Doe</h4>
        </div>
        <div class="cert-body">
            <div class="info-grid">
                <div class="info-item"><span class="info-label">Issued Date</span><br><strong>May 15, 2025</strong></div>
                <div class="info-item"><span class="info-label">Expiry Date</span><br><strong>May 15, 2027</strong></div>
                <div class="info-item"><span class="info-label">Credential ID</span><br><strong>CERT-2025-0042</strong></div>
                <div class="info-item"><span class="info-label">Issuing Authority</span><br><strong>Han-Tech Training Academy</strong></div>
            </div>
            <hr class="my-4">
            <div class="text-center">
                <a href="download.html" class="btn-download"><i class="bi bi-download me-2"></i>Download PDF Certificate</a>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/client-portal/auth-guard.js"></script>
    <script>
        (function() {
            if (!AuthGuard.check()) return;
            const user = AuthGuard.getUser();
            document.getElementById('recipientName').textContent = user.displayName;

            async function load(u, i) { try { const r = await fetch(u); document.getElementById(i).innerHTML = await r.text(); } catch(e) {} }
            load('/components/layouts/header.html', 'header-container');
            load('/components/layouts/footer.html', 'footer-container');
        })();
    </script>
</body>
</html>
