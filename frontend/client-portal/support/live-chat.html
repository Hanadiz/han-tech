 <!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chat | Han-Tech Ltd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f5f7fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .chat-widget { background: #fff; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); overflow: hidden; }
        [data-theme="dark"] .chat-widget { background: #1a1a2e; }
        .chat-header { background: linear-gradient(135deg, #0077b6, #00b4d8); color: #fff; padding: 16px 20px; }
        .chat-body { height: 300px; overflow-y: auto; padding: 15px; }
        .message { margin-bottom: 12px; }
        .message.agent { text-align: left; }
        .message.agent span { background: #f0f4f8; padding: 8px 12px; border-radius: 12px; display: inline-block; }
        .message.user { text-align: right; }
        .message.user span { background: linear-gradient(135deg, #0077b6, #00b4d8); color: #fff; padding: 8px 12px; border-radius: 12px; display: inline-block; }
        .chat-footer { display: flex; padding: 10px; border-top: 1px solid #e0e0e0; }
        .chat-footer input { flex: 1; border-radius: 20px; border: 1px solid #e0e0e0; padding: 10px 15px; }
        .chat-footer button { background: linear-gradient(135deg, #0077b6, #00b4d8); color: #fff; border: none; border-radius: 50%; width: 40px; height: 40px; margin-left: 8px; }
    </style>
</head>
<body>
    <div class="chat-widget">
        <div class="chat-header"><i class="bi bi-chat-dots"></i> Live Support</div>
        <div class="chat-body" id="chatBody">
            <div class="message agent"><span>Hello! How can we help you today?</span></div>
            <div class="message user"><span>I have a billing question.</span></div>
            <div class="message agent"><span>Sure, I can help with that. Can you provide your invoice number?</span></div>
        </div>
        <div class="chat-footer">
            <input type="text" placeholder="Type a message..." id="chatInput">
            <button onclick="sendMessage()"><i class="bi bi-send"></i></button>
        </div>
    </div>
    <script>
        function sendMessage() {
            const input = document.getElementById('chatInput');
            if (!input.value.trim()) return;
            const chatBody = document.getElementById('chatBody');
            const msg = document.createElement('div');
            msg.className = 'message user';
            msg.innerHTML = '<span>' + input.value + '</span>';
            chatBody.appendChild(msg);
            input.value = '';
            chatBody.scrollTop = chatBody.scrollHeight;
            setTimeout(() => {
                const reply = document.createElement('div');
                reply.className = 'message agent';
                reply.innerHTML = '<span>Thank you for your message. Our team will get back to you shortly.</span>';
                chatBody.appendChild(reply);
                chatBody.scrollTop = chatBody.scrollHeight;
            }, 1000);
        }
    </script>
</body>
</html>
