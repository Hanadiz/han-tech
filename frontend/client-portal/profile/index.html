<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Han-Tech Ltd</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f5f7fa; }
        .profile-card { max-width: 550px; margin: 60px auto; background: #fff; border-radius: 20px; padding: 40px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        [data-theme="dark"] .profile-card { background: #1a1a2e; }
        .profile-avatar { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #0077b6, #00b4d8); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 2.5rem; font-weight: 700; margin: 0 auto 20px; }
        h3 { font-family: 'Poppins', sans-serif; font-weight: 700; }
        .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
        [data-theme="dark"] .info-row { border-color: #2a2a40; }
        .info-label { color: #888; font-size: 0.85rem; }
        .btn-edit { background: linear-gradient(135deg, #0077b6, #00b4d8); color: #fff; padding: 12px 28px; border-radius: 12px; font-weight: 600; text-decoration: none; display: inline-block; margin-top: 25px; }
    </style>
</head>
<body>
    <div id="header-container"></div>
    <div class="profile-card">
        <div class="profile-avatar" id="avatar">U</div>
        <h3 id="profileName">User</h3>
        <p class="text-muted" id="profileEmail">user@example.com</p>
        <div class="info-row"><span class="info-label">Member since</span><strong>January 2023</strong></div>
        <div class="info-row"><span class="info-label">Company</span><strong>Acme Corp</strong></div>
        <div class="info-row"><span class="info-label">Country</span><strong>Uganda</strong></div>
        <a href="edit.html" class="btn-edit">Edit Profile</a>
    </div>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/client-portal/auth-guard.js"></script>
    <script>
        (function(){if(!AuthGuard.check())return;const u=AuthGuard.getUser();document.getElementById('profileName').textContent=u.displayName;document.getElementById('profileEmail').textContent=u.email;document.getElementById('avatar').textContent=u.initials;async function load(f,i){try{const r=await fetch(f);document.getElementById(i).innerHTML=await r.text()}catch(e){}}load('/components/layouts/header.html','header-container');load('/components/layouts/footer.html','footer-container');})();
    </script>
</body>
</html>
