<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | Han-Tech Ltd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f5f7fa; }
        .form-card { max-width: 700px; margin: 40px auto; background: #fff; border-radius: 20px; padding: 35px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        [data-theme="dark"] .form-card { background: #1a1a2e; }
        h3 { font-family: 'Poppins', sans-serif; }
        .avatar-upload { display: flex; align-items: center; gap: 20px; margin-bottom: 25px; }
        .avatar-preview { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #0077b6, #00b4d8); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 2rem; font-weight: 700; }
        .btn-save { background: linear-gradient(135deg, #0077b6, #00b4d8); color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 600; width: 100%; }
        .form-control, .form-select { border-radius: 12px; padding: 12px; border: 2px solid #e0e0e0; }
        [data-theme="dark"] .form-control, [data-theme="dark"] .form-select { background: #0f0f1a; border-color: #2a2a40; color: #e0e0e0; }
    </style>
</head>
<body>
    <div id="header-container"></div>

    <div class="form-card">
        <h3>Edit Profile</h3>
        <form id="editForm">
            <input type="hidden" id="csrfToken">
            <!-- Avatar -->
            <div class="avatar-upload">
                <div class="avatar-preview" id="avatarPreview">U</div>
                <div>
                    <label class="btn btn-outline-primary btn-sm">Change Photo<input type="file" hidden></label>
                    <p class="text-muted small mt-1">JPG, PNG up to 2MB</p>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3"><label>Full Name</label><input type="text" class="form-control" id="name" required></div>
                <div class="col-md-6 mb-3"><label>Email</label><input type="email" class="form-control" id="email" required></div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3"><label>Phone</label><input type="tel" class="form-control" id="phone" placeholder="+256..."></div>
                <div class="col-md-6 mb-3"><label>Company</label><input type="text" class="form-control" id="company"></div>
            </div>
            <div class="mb-3"><label>Address</label><input type="text" class="form-control" id="address" placeholder="Street address"></div>
            <div class="row">
                <div class="col-md-6 mb-3"><label>City</label><input type="text" class="form-control" id="city"></div>
                <div class="col-md-6 mb-3"><label>Country</label><select class="form-select" id="country"><option>Uganda</option><option>Kenya</option><option>Tanzania</option></select></div>
            </div>

            <!-- Password change section -->
            <hr class="my-4">
            <h5 class="mb-3">Change Password</h5>
            <div class="mb-3"><label>Current Password</label><input type="password" class="form-control" id="currentPwd"></div>
            <div class="mb-3"><label>New Password</label><input type="password" class="form-control" id="newPwd" minlength="8"></div>
            <div class="mb-3"><label>Confirm New Password</label><input type="password" class="form-control" id="confirmPwd"></div>

            <button type="submit" class="btn-save">Save Changes</button>
        </form>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/client-portal/auth-guard.js"></script>
    <script>
        (function(){
            if (!AuthGuard.check()) return;
            const u = AuthGuard.getUser();
            document.getElementById('name').value = u.displayName;
            document.getElementById('email').value = u.email;
            document.getElementById('avatarPreview').textContent = u.initials;
            document.getElementById('csrfToken').value = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,'0')).join('');

            document.getElementById('editForm').addEventListener('submit', function(e) {
                e.preventDefault();
                // Basic validation
                const newPwd = document.getElementById('newPwd').value;
                const confirmPwd = document.getElementById('confirmPwd').value;
                if (newPwd && newPwd !== confirmPwd) {
                    alert('New passwords do not match.');
                    return;
                }
                alert('Profile updated successfully!');
                window.location.href = 'index.html';
            });

            async function load(u,i){ try { const r = await fetch(u); document.getElementById(i).innerHTML = await r.text(); } catch(e) {} }
            load('/components/layouts/header.html','header-container');
            load('/components/layouts/footer.html','footer-container');
        })();
    </script>
</body>
</html>
