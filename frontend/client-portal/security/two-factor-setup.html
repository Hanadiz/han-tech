
 <!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup 2FA | Han-Tech Ltd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f5f7fa; }
        .setup-card { max-width: 500px; margin: 60px auto; background: #fff; border-radius: 20px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        [data-theme="dark"] .setup-card { background: #1a1a2e; }
        h3 { font-family: 'Poppins', sans-serif; }
        .qr-placeholder { background: #f0f0f0; width: 180px; height: 180px; margin: 20px auto; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 4rem; color: #aaa; }
        .code-input { display: flex; gap: 10px; justify-content: center; }
        .code-input input { width: 45px; height: 50px; text-align: center; font-size: 1.5rem; border-radius: 10px; border: 2px solid #e0e0e0; }
        .btn-primary { background: linear-gradient(135deg, #0077b6, #00b4d8); border: none; padding: 12px 30px; border-radius: 12px; }
    </style>
</head>
<body>
    <div id="header-container"></div>
    <div class="setup-card text-center">
        <h3>Enable Two-Factor Authentication</h3>
        <p>Scan this QR code with your authenticator app.</p>
        <div class="qr-placeholder"><i class="bi bi-qr-code"></i></div>
        <p class="text-muted small">Or enter this key manually:<br><code>ABCD EFGH IJKL MNOP</code></p>
        <div class="code-input my-4">
            <input type="text" maxlength="1" class="form-control">
            <input type="text" maxlength="1" class="form-control">
            <input type="text" maxlength="1" class="form-control">
            <input type="text" maxlength="1" class="form-control">
            <input type="text" maxlength="1" class="form-control">
            <input type="text" maxlength="1" class="form-control">
        </div>
        <button class="btn btn-primary" onclick="alert('2FA enabled successfully!')">Verify & Enable</button>
    </div>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/client-portal/auth-guard.js"></script>
    <script>
        (function(){ if(!AuthGuard.check())return; async function load(u,i){try{const r=await fetch(u);document.getElementById(i).innerHTML=await r.text()}catch(e){}} load('/components/layouts/header.html','header-container'); load('/components/layouts/footer.html','footer-container'); })();
    </script>
</body>
</html>
