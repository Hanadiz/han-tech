<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Han-Tech Ltd | Uganda's Complete Technology Partner</title>
    <meta name="description" content="Han-Tech Ltd delivers 15 comprehensive IT service categories. Your technology. Our priority.">
    <!-- Preconnects / CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <!-- Minimal global styles (scroll progress, preloader) -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; }
        .scroll-progress {
            position: fixed; top: 0; left: 0; height: 3px;
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            z-index: 10001; border-radius: 0 3px 3px 0;
            transition: width 0.1s linear;
        }
        .preloader {
            position: fixed; inset: 0; background: #fff; display: flex;
            align-items: center; justify-content: center; z-index: 9999;
            transition: opacity 0.5s, visibility 0.5s;
        }
        [data-theme="dark"] .preloader { background: #0f0f1a; }
        .preloader.hidden { opacity: 0; visibility: hidden; }
        .preloader-spinner {
            width: 50px; height: 50px; border: 3px solid #e0e0e0;
            border-top-color: #0077b6; border-right-color: #00b4d8;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <!-- Scroll Progress Bar -->
    <div class="scroll-progress" id="scrollProgress"></div>

    <!-- Preloader -->
    <div class="preloader" id="preloader"><div class="preloader-spinner"></div></div>

    <!-- Component containers -->
    <div id="header-container"></div>
    <div id="hero-container"></div>
    <div id="featured-container"></div>
    <div id="why-us-container"></div>
    <div id="testimonials-container"></div>
    <div id="stats-container"></div>
    <div id="blog-container"></div>
    <div id="partners-container"></div>
    <div id="cta-container"></div>
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Simple component loader
        async function loadComponent(url, containerId) {
            try {
                const resp = await fetch(url);
                if (!resp.ok) throw new Error(`Failed to load ${url}`);
                document.getElementById(containerId).innerHTML = await resp.text();
            } catch (e) {
                console.error(e);
            }
        }

        (async function() {
            // Load layout components
            await loadComponent('/components/layouts/header.html', 'header-container');

            // Load all home sections in order
            await loadComponent('/pages/home/hero-banner.html', 'hero-container');
            await loadComponent('/pages/home/featured-services.html', 'featured-container');
            await loadComponent('/pages/home/why-choose-us.html', 'why-us-container');
            await loadComponent('/pages/home/testimonials.html', 'testimonials-container');
            await loadComponent('/pages/home/stats-bar.html', 'stats-container');
            await loadComponent('/pages/home/recent-blog.html', 'blog-container');
            await loadComponent('/pages/home/partners.html', 'partners-container');
            await loadComponent('/pages/home/cta-section.html', 'cta-container');

            await loadComponent('/components/layouts/footer.html', 'footer-container');

            // After all components are loaded:
            document.getElementById('preloader').classList.add('hidden');

            // Scroll progress
            const bar = document.getElementById('scrollProgress');
            window.addEventListener('scroll', () => {
                const h = document.documentElement.scrollHeight - window.innerHeight;
                bar.style.width = (window.scrollY / h) * 100 + '%';
            });

            // Initialize AOS (if you want animations on the loaded sections)
            if (typeof AOS !== 'undefined') {
                AOS.init({ duration: 800, once: true, offset: 60 });
            }
        })();
    </script>
</body>
</html>
