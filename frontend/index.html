<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Han-Tech Ltd | Uganda's Complete Technology Partner</title>
    <meta name="description" content="…">
    <!-- Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <!-- External CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <!-- Global styles (only very minimal things like scroll-progress, preloader, mouse glow) -->
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Inter', sans-serif; }
        .scroll-progress {
            position: fixed; top:0; left:0; height:3px;
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            z-index: 10001; border-radius: 0 3px 3px 0;
            transition: width 0.1s linear;
        }
        .preloader {
            position: fixed; inset:0; background:#fff; display:flex;
            align-items:center; justify-content:center; z-index:9999;
            transition: opacity 0.5s, visibility 0.5s;
        }
        [data-theme="dark"] .preloader { background:#0f0f1a; }
        .preloader.hidden { opacity:0; visibility:hidden; }
        .preloader-spinner {
            width:50px; height:50px; border:3px solid #e0e0e0;
            border-top-color:#0077b6; border-right-color:#00b4d8;
            border-radius:50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</head>
<body>
    <div class="scroll-progress" id="scrollProgress"></div>
    <div class="preloader" id="preloader"><div class="preloader-spinner"></div></div>

    <!-- Component placeholders -->
    <div id="header-container"></div>
    <div id="hero-container"></div>

    <!-- Static sections (trusted, services, cta) – keep as in your original index.html -->
    <section class="trusted-section"> … </section>
    <section class="section-padding" id="services"> … </section>
    <section class="cta-section"> … </section>

    <div id="footer-container"></div>

    <!-- Bootstrap JS + AOS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <!-- Component loader + global init -->
    <script>
        (async function() {
            // Load components
            await Promise.all([
                loadComponent('components/layouts/header.html', 'header-container'),
                loadComponent('components/layouts/hero.html', 'hero-container'),
                loadComponent('components/layouts/footer.html', 'footer-container')
            ]);

            // Global inits after all components are in the DOM
            AOS.init({ duration: 800, once: true, offset: 60 });
            document.getElementById('preloader').classList.add('hidden');

            // Scroll progress
            const bar = document.getElementById('scrollProgress');
            window.addEventListener('scroll', () => {
                const h = document.documentElement.scrollHeight - window.innerHeight;
                bar.style.width = (window.scrollY / h) * 100 + '%';
            });

            async function loadComponent(url, containerId) {
                try {
                    const resp = await fetch(url);
                    const html = await resp.text();
                    document.getElementById(containerId).innerHTML = html;
                } catch (e) {
                    console.error(`Failed to load ${url}:`, e);
                }
            }
        })();
    </script>
</body>
</html>
