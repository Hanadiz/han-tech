<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Han-Tech Ltd | Uganda's Complete Technology Partner</title>
    <meta name="description" content="Han-Tech Ltd delivers 15 comprehensive IT service categories. Your technology. Our priority.">
    <meta name="keywords" content="IT solutions Uganda, Han-Tech Ltd, technology services, networking, cloud, security, IoT, EdTech">
    <meta name="author" content="Han-Tech Ltd">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://hantech.com/">
    <meta property="og:title" content="Han-Tech Ltd | Uganda's Complete Technology Partner">
    <meta property="og:description" content="15 comprehensive IT service categories.">
    <meta property="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/x-icon" href="assets/images/logo/favicon.ico">
    <link rel="canonical" href="https://hantech.com/">

    <!-- Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <!-- External CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <!-- Minimal global styles -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; }
        .scroll-progress {
            position: fixed; top: 0; left: 0; height: 3px;
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            z-index: 10001; border-radius: 0 3px 3px 0;
            transition: width 0.1s linear;
        }
        .preloader {
            position: fixed; inset: 0; background: #fff; display: flex;
            align-items: center; justify-content: center; z-index: 9999;
            transition: opacity 0.5s, visibility 0.5s;
        }
        [data-theme="dark"] .preloader { background: #0f0f1a; }
        .preloader.hidden { opacity: 0; visibility: hidden; }
        .preloader-spinner {
            width: 50px; height: 50px; border: 3px solid #e0e0e0;
            border-top-color: #0077b6; border-right-color: #00b4d8;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .back-to-top {
            position: fixed; bottom: 30px; right: 30px;
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            color: #fff; border: 2px solid rgba(255,255,255,0.2);
            border-radius: 14px; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; cursor: pointer; z-index: 999;
            opacity: 0; visibility: hidden; transform: translateY(20px);
            transition: all 0.3s ease; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        .back-to-top.visible { opacity: 1; visibility: visible; transform: translateY(0); }
        .back-to-top:hover { transform: translateY(-4px) !important; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
    </style>
</head>
<body>
    <!-- Scroll Progress Bar -->
    <div class="scroll-progress" id="scrollProgress"></div>

    <!-- Preloader -->
    <div class="preloader" id="preloader"><div class="preloader-spinner"></div></div>

    <!-- Component containers -->
    <div id="header-container"></div>
    <div id="hero-container"></div>
    <div id="featured-container"></div>
    <div id="why-us-container"></div>
    <div id="clients-container"></div>
    <div id="trust-container"></div>
    <div id="testimonials-container"></div>
    <div id="stats-container"></div>
    <div id="pricing-preview-container"></div>
    <div id="portfolio-preview-container"></div>
    <div id="team-preview-container"></div>
    <div id="blog-container"></div>
    <div id="partners-container"></div>
    <div id="faq-preview-container"></div>
    <div id="cta-container"></div>
    <div id="subscribe-container"></div>
    <div id="footer-container"></div>

    <!-- Back‑to‑top button -->
    <button class="back-to-top" id="backToTop" aria-label="Back to top">
        <i class="bi bi-arrow-up"></i>
    </button>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <!-- Component Loader + Global Init -->
    <script>
        async function load(url, containerId) {
            try {
                const resp = await fetch(url);
                if (!resp.ok) throw new Error(`Failed to load ${url}`);
                document.getElementById(containerId).innerHTML = await resp.text();
            } catch (e) {
                console.error(e);
            }
        }

        (async function() {
            // Load layout
            await load('/components/layouts/header.html', 'header-container');

            // Load all home page sections in order
            await load('/pages/home/hero-banner.html', 'hero-container');
            await load('/pages/home/featured-services.html', 'featured-container');
            await load('/pages/home/why-choose-us.html', 'why-us-container');
            await load('/pages/home/clients-counter.html', 'clients-container');
            await load('/pages/home/trust-badges.html', 'trust-container');
            await load('/pages/home/testimonials.html', 'testimonials-container');
            await load('/pages/home/stats-bar.html', 'stats-container');
            await load('/pages/home/pricing-preview.html', 'pricing-preview-container');
            await load('/pages/home/portfolio-preview.html', 'portfolio-preview-container');
            await load('/pages/home/team-preview.html', 'team-preview-container');
            await load('/pages/home/recent-blog.html', 'blog-container');
            await load('/pages/home/partners.html', 'partners-container');
            await load('/pages/home/faq-preview.html', 'faq-preview-container');
            await load('/pages/home/cta-section.html', 'cta-container');
            await load('/pages/home/subscribe-section.html', 'subscribe-container');

            await load('/components/layouts/footer.html', 'footer-container');

            // Hide preloader
            document.getElementById('preloader').classList.add('hidden');

            // Scroll progress bar
            const bar = document.getElementById('scrollProgress');
            window.addEventListener('scroll', () => {
                const h = document.documentElement.scrollHeight - window.innerHeight;
                bar.style.width = (window.scrollY / h) * 100 + '%';
            });

            // Back‑to‑top button
            const backBtn = document.getElementById('backToTop');
            window.addEventListener('scroll', () => backBtn.classList.toggle('visible', window.scrollY > 400));
            backBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

            // Initialize AOS
            if (typeof AOS !== 'undefined') {
                AOS.init({ duration: 800, once: true, offset: 60 });
            }

            console.log('%c🚀 Han-Tech Dynamic Engine Ready %c| %cAll sections loaded',
                'color:#00b4d8;font-weight:bold;', '', 'color:#2ecc71;');
        })();
    </script>
</body>
</html>
