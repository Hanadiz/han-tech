<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Han-Tech Ltd | Uganda's Complete Technology Partner</title>
    <meta name="description" content="Han-Tech Ltd delivers 15 comprehensive IT service categories. Your technology. Our priority.">
    <meta name="keywords" content="IT solutions Uganda, Han-Tech Ltd, technology services, networking, cloud, security, IoT, EdTech">
    <meta name="author" content="Han-Tech Ltd">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://hantech.com/">
    <meta property="og:title" content="Han-Tech Ltd | Uganda's Complete Technology Partner">
    <meta property="og:description" content="15 comprehensive IT service categories.">
    <meta property="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/x-icon" href="assets/images/logo/favicon.ico">
    <link rel="canonical" href="https://hantech.com/">

    <!-- Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <!-- External CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <!-- Minimal global styles -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f9fafb; }
        [data-theme="dark"] body { background: #0a1628; }

        /* ----- Scroll Progress Bar (Cyan/Blue) ----- */
        .scroll-progress {
            position: fixed; top: 0; left: 0; height: 3px;
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            z-index: 10001; border-radius: 0 3px 3px 0;
            transition: width 0.1s linear;
        }

        /* ----- Preloader (Cyan/Blue/Orange Gradient) ----- */
        .preloader {
            position: fixed; inset: 0; background: #ffffff;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
            transition: opacity 0.5s, visibility 0.5s;
            gap: 1.5rem;
        }
        [data-theme="dark"] .preloader { background: #0f0f1a; }
        .preloader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .preloader-spinner {
            width: 60px; height: 60px;
            border: 4px solid #e0e0e0;
            border-top-color: #00b4d8;
            border-right-color: #0077b6;
            border-bottom-color: #f4a261;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.6, 0, 0.4, 1) infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .preloader-text {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #0077b6, #00b4d8, #f4a261);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        /* ----- Back‑to‑top (Cyan/Blue) ----- */
        .back-to-top {
            position: fixed; bottom: 30px; right: 30px;
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            color: #fff; border: 2px solid rgba(255,255,255,0.2);
            border-radius: 14px; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; cursor: pointer; z-index: 999;
            opacity: 0; visibility: hidden; transform: translateY(20px);
            transition: all 0.3s ease; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        .back-to-top.visible { opacity: 1; visibility: visible; transform: translateY(0); }
        .back-to-top:hover { transform: translateY(-4px) !important; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }

        /* ----- Lazy Loading Placeholder (Cyan/Blue/Orange) ----- */
        .section-placeholder {
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: var(--bs-body-bg, #f9fafb);
            border-radius: 0.5rem;
            margin: 0.5rem 0;
            gap: 1rem;
            transition: opacity 0.4s ease;
            opacity: 0.6;
        }
        .section-placeholder .loader-ring {
            width: 40px; height: 40px;
            border: 3px solid #e0e0e0;
            border-top-color: #00b4d8;
            border-right-color: #0077b6;
            border-bottom-color: #f4a261;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        .section-placeholder .loader-text {
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            font-size: 0.9rem;
            color: #6b7280;
            letter-spacing: 0.5px;
        }
        [data-theme="dark"] .section-placeholder .loader-text {
            color: #a0a0b0;
        }

        .section-placeholder.loaded {
            opacity: 1;
        }

        /* ===== Container spacing ===== */
        #header-container { position: sticky; top: 0; z-index: 1000; }
        #hero-container { margin-top: -1px; }
        .component-section { width: 100%; }
    </style>
</head>
<body>
    <!-- Scroll Progress Bar -->
    <div class="scroll-progress" id="scrollProgress"></div>

    <!-- Preloader -->
    <div class="preloader" id="preloader">
        <div class="preloader-spinner"></div>
        <div class="preloader-text">Han-Tech Ltd</div>
    </div>

    <!-- ===== COMPONENT CONTAINERS ===== -->
    <div id="header-container"></div>
    <div id="hero-container"></div>
    <div id="featured-container"></div>
    <div id="why-us-container"></div>
    <div id="clients-container"></div>
    <div id="trust-container"></div>
    <div id="testimonials-container"></div>
    <div id="stats-container"></div>
    <div id="pricing-preview-container"></div>
    <div id="portfolio-preview-container"></div>
    <div id="team-preview-container"></div>
    <div id="blog-container"></div>
    <div id="partners-container"></div>
    <div id="faq-preview-container"></div>
    <div id="cta-container"></div>
    <div id="subscribe-container"></div>
    <div id="footer-container"></div>

    <!-- Back‑to‑top button -->
    <button class="back-to-top" id="backToTop" aria-label="Back to top">
        <i class="bi bi-arrow-up"></i>
    </button>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <!-- ============================================================
         LAZY LOADER ENGINE
         ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            // 1. CONFIGURATION
            // ============================================================
            const LAZY_SECTIONS = [
                'hero-container',           // Hero is above fold but we load immediately
                'featured-container',
                'why-us-container',
                'clients-container',
                'trust-container',
                'testimonials-container',
                'stats-container',
                'pricing-preview-container',
                'portfolio-preview-container',
                'team-preview-container',
                'blog-container',
                'partners-container',
                'faq-preview-container',
                'cta-container',
                'subscribe-container'
            ];

            // Sections that must load immediately (header & footer)
            const IMMEDIATE_SECTIONS = ['header-container', 'footer-container'];

            // Mapping of container ID → component URL
            const COMPONENT_MAP = {
                'header-container': '/components/layouts/header.html',
                'footer-container': '/components/layouts/footer.html',
                'hero-container': '/pages/home/hero-banner.html',
                'featured-container': '/pages/home/featured-services.html',
                'why-us-container': '/pages/home/why-choose-us.html',
                'clients-container': '/pages/home/clients-counter.html',
                'trust-container': '/pages/home/trust-badges.html',
                'testimonials-container': '/pages/home/testimonials.html',
                'stats-container': '/pages/home/stats-bar.html',
                'pricing-preview-container': '/pages/home/pricing-preview.html',
                'portfolio-preview-container': '/pages/home/portfolio-preview.html',
                'team-preview-container': '/pages/home/team-preview.html',
                'blog-container': '/pages/home/recent-blog.html',
                'partners-container': '/pages/home/partners.html',
                'faq-preview-container': '/pages/home/faq-preview.html',
                'cta-container': '/pages/home/cta-section.html',
                'subscribe-container': '/pages/home/subscribe-section.html'
            };

            // ============================================================
            // 2. HELPERS
            // ============================================================

            /** Fetch a component HTML with error handling */
            async function fetchComponent(url) {
                try {
                    const resp = await fetch(url);
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    return await resp.text();
                } catch (e) {
                    console.error(`Failed to load ${url}:`, e);
                    return `<div class="text-danger p-3 text-center">⚠️ Failed to load component</div>`;
                }
            }

            /** Inject HTML into container and remove placeholder */
            function injectComponent(containerId, html) {
                const container = document.getElementById(containerId);
                if (!container) return;
                container.innerHTML = html;
                // Mark as loaded (for CSS styling)
                container.classList.add('loaded');
            }

            /** Show placeholder inside container */
            function showPlaceholder(containerId) {
                const container = document.getElementById(containerId);
                if (!container) return;
                container.innerHTML = `
                    <div class="section-placeholder">
                        <div class="loader-ring"></div>
                        <div class="loader-text">Loading …</div>
                    </div>
                `;
                container.classList.remove('loaded');
            }

            /** Load a component (with placeholder) */
            async function loadComponent(containerId) {
                const url = COMPONENT_MAP[containerId];
                if (!url) {
                    console.warn(`No URL mapped for container: ${containerId}`);
                    return;
                }
                showPlaceholder(containerId);
                const html = await fetchComponent(url);
                injectComponent(containerId, html);
            }

            // ============================================================
            // 3. LAZY LOAD WITH INTERSECTION OBSERVER
            // ============================================================

            function initLazyLoading() {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const containerId = entry.target.id;
                            // Avoid reloading if already loaded
                            if (containerId && !entry.target.classList.contains('loaded')) {
                                loadComponent(containerId);
                            }
                            // Unobserve after loading
                            observer.unobserve(entry.target);
                        }
                    });
                }, {
                    rootMargin: '200px 0px', // start loading 200px before entering viewport
                    threshold: 0.01
                });

                // Observe all lazy containers
                LAZY_SECTIONS.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        // Show placeholder immediately
                        showPlaceholder(id);
                        observer.observe(el);
                    }
                });
            }

            // ============================================================
            // 4. BOOTSTRAP
            // ============================================================

            (async function boot() {
                // 1. Load immediate sections (header & footer)
                for (const id of IMMEDIATE_SECTIONS) {
                    await loadComponent(id);
                }

                // 2. Initialise lazy loading for all other sections
                initLazyLoading();

                // 3. Hide preloader
                document.getElementById('preloader').classList.add('hidden');

                // 4. Scroll progress bar
                const bar = document.getElementById('scrollProgress');
                window.addEventListener('scroll', () => {
                    const h = document.documentElement.scrollHeight - window.innerHeight;
                    bar.style.width = (window.scrollY / h) * 100 + '%';
                });

                // 5. Back‑to‑top button
                const backBtn = document.getElementById('backToTop');
                window.addEventListener('scroll', () => backBtn.classList.toggle('visible', window.scrollY > 400));
                backBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

                // 6. AOS
                if (typeof AOS !== 'undefined') {
                    AOS.init({ duration: 800, once: true, offset: 60 });
                }

                console.log('%c🚀 Han-Tech Lazy Loading Engine Ready',
                    'color:#00b4d8;font-weight:bold;');
            })();

        })();
    </script>
</body>
</html>
