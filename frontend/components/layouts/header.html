</style>

<!-- HEADER SCRIPTS -->
<script>
    (function() {
        // ========== Active Link Detection ==========
        const currentPath = window.location.pathname;
        document.querySelectorAll('.nav-link').forEach(link => {
            const parent = link.parentElement;
            parent.classList.remove('active');
            const href = link.getAttribute('href');
            if (!href) return;
            if (currentPath === href || (href !== '/index.html' && currentPath.startsWith(href.replace(/\/?$/, '/')))) {
                parent.classList.add('active');
            }
            if (href === '/index.html' && (currentPath === '/' || currentPath === '/index.html')) {
                parent.classList.add('active');
            }
        });

        // ========== Dynamic Greeting ==========
        const welcomeBtn = document.getElementById('welcomeBtn');
        function updateGreeting() {
            if (!welcomeBtn) return;
            const hour = new Date().getHours();
            let greeting;
            if (hour >= 5 && hour < 12) greeting = 'Good Morning';
            else if (hour >= 12 && hour < 17) greeting = 'Good Afternoon';
            else if (hour >= 17 && hour < 21) greeting = 'Good Evening';
            else greeting = 'Good Night';
            welcomeBtn.innerHTML = `<i class="fas fa-hand-wave"></i> ${greeting}`;
        }
        updateGreeting();

        // ========== Auth State Toggle ==========
        const signInBtn = document.getElementById('signInBtn');
        const signOutBtn = document.getElementById('signOutBtn');
        const profileIcon = document.getElementById('profileIcon');
        const miniSignIn = document.getElementById('miniSignIn');
        const miniSignOut = document.getElementById('miniSignOut');
        
        function updateAuthUI() {
            const token = sessionStorage.getItem('authToken') || localStorage.getItem('authToken');
            const userEmail = sessionStorage.getItem('userEmail') || localStorage.getItem('userEmail');
            
            if (token) {
                if (signInBtn) signInBtn.style.display = 'none';
                if (signOutBtn) signOutBtn.style.display = 'inline-flex';
                if (profileIcon) profileIcon.style.display = 'block';
                if (miniSignIn) miniSignIn.style.display = 'none';
                if (miniSignOut) miniSignOut.style.display = 'inline-flex';
                if (welcomeBtn) {
                    welcomeBtn.disabled = false;
                    welcomeBtn.style.opacity = '1';
                    if (userEmail) {
                        const firstName = userEmail.split('@')[0];
                        welcomeBtn.innerHTML = `<i class="fas fa-user-circle"></i> ${firstName}`;
                    } else {
                        updateGreeting();
                    }
                }
            } else {
                if (signInBtn) signInBtn.style.display = 'inline-flex';
                if (signOutBtn) signOutBtn.style.display = 'none';
                if (profileIcon) profileIcon.style.display = 'none';
                if (miniSignIn) miniSignIn.style.display = 'inline-flex';
                if (miniSignOut) miniSignOut.style.display = 'none';
                if (welcomeBtn) {
                    welcomeBtn.disabled = true;
                    welcomeBtn.style.opacity = '0.7';
                    updateGreeting();
                }
            }
        }

        updateAuthUI();
        window.addEventListener('storage', updateAuthUI);

        // ========== Mini Header Scroll Logic ==========
        const miniHeader = document.getElementById('miniHeader');
        let lastScrollY = window.scrollY;
        const scrollThreshold = 300; // Show mini header after scrolling 300px

        window.addEventListener('scroll', () => {
            const currentScroll = window.scrollY;
            const mainHeader = document.getElementById('mainHeader');
            
            // Show mini header when scrolled past threshold AND scrolling up
            if (currentScroll > scrollThreshold && currentScroll < lastScrollY) {
                miniHeader.classList.add('visible');
            } else if (currentScroll <= scrollThreshold || currentScroll > lastScrollY) {
                miniHeader.classList.remove('visible');
            }
            
            // Main header shadow on scroll
            if (mainHeader) mainHeader.classList.toggle('scrolled', currentScroll > 50);
            
            lastScrollY = currentScroll;
        });

        // ========== Cart Badge ==========
        const cartBadge = document.getElementById('cartBadge');
        const cartCount = parseInt(sessionStorage.getItem('cartCount')) || 0;
        if (cartCount > 0 && cartBadge) {
            cartBadge.style.display = 'flex';
            cartBadge.textContent = cartCount;
        }

        // ========== Theme‑aware Logo Swap ==========
        function updateLogo() {
            const theme = document.documentElement.getAttribute('data-theme') || 'light';
            document.querySelectorAll('.logo-light').forEach(img => img.style.display = theme === 'dark' ? 'none' : 'block');
            document.querySelectorAll('.logo-dark').forEach(img => img.style.display = theme === 'dark' ? 'block' : 'none');
        }
        updateLogo();
        const observer = new MutationObserver(updateLogo);
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

        // ========== Search ==========
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const query = searchInput.value.trim();
                    if (query) {
                        window.location.href = '/pages/search/results.html?q=' + encodeURIComponent(query);
                    }
                }
            });
        }
    })();
</script>
