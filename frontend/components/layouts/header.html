<!-- HEADER SCRIPTS -->
<script>
    (function() {
        // Set active nav link based on absolute path
        const currentPath = window.location.pathname;
        document.querySelectorAll('.nav-link').forEach(link => {
            const parent = link.parentElement;
            parent.classList.remove('active');
            const href = link.getAttribute('href');
            if (href && currentPath.endsWith(href.replace(/\/?$/, '/'))) {
                parent.classList.add('active');
            }
            // Also set Home active if we are at the root or under /pages/home/
            if ((href === '/index.html' && (currentPath === '/' || currentPath === '/index.html' || currentPath.startsWith('/pages/home/')))) {
                parent.classList.add('active');
            }
        });

        // Welcome button greeting
        const welcomeBtn = document.getElementById('welcomeBtn');
        if (welcomeBtn) {
            const hour = new Date().getHours();
            const greeting = hour < 12 ? 'Good Morning' : hour < 17 ? 'Good Afternoon' : 'Good Evening';
            welcomeBtn.innerHTML = `<i class="fas fa-hand-wave"></i> ${greeting}`;
        }

        // Header scroll effect
        window.addEventListener('scroll', () => {
            const header = document.getElementById('mainHeader');
            if (header) {
                header.classList.toggle('scrolled', window.scrollY > 50);
            }
        });
    })();
</script>
