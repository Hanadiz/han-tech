<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Open Positions | Han-Tech Ltd Careers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #0a2463;
            --primary-dark: #071b4a;
            --accent: #e67e22;
            --accent-dark: #d35400;
            --white: #ffffff;
            --gray-50: #f8fafc;
            --gray-200: #e2e8f0;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-800: #1e293b;
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
            --radius: 0.75rem;
            --font-sans: 'Inter', sans-serif;
            --font-poppins: 'Poppins', sans-serif;
        }
        body {
            font-family: var(--font-sans);
            line-height: 1.6;
            color: var(--gray-800);
            background: var(--white);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }
        .section-tag {
            display: inline-block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 0.75rem;
        }
        .section-title {
            font-family: var(--font-poppins);
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }
        .section-subtitle {
            font-size: 1.05rem;
            color: var(--gray-500);
            max-width: 600px;
            margin: 0 auto;
        }
        .section {
            padding: 80px 0;
        }
        .section-light {
            background: var(--gray-50);
        }

        .page-header {
            padding: 120px 0 40px;
            background: linear-gradient(135deg, #0a2463, #1e3a8a);
            color: white;
            text-align: center;
        }
        .page-header h1 {
            font-family: var(--font-poppins);
            font-size: 3rem;
            font-weight: 800;
        }
        .page-header h1 span {
            color: var(--accent);
        }
        .page-header p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }

        .job-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .job-filter-btn {
            padding: 0.5rem 1.2rem;
            border: 1px solid var(--gray-200);
            background: white;
            border-radius: 2rem;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            color: var(--gray-600);
        }
        .job-filter-btn:hover,
        .job-filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .jobs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.5rem;
            max-width: 1100px;
            margin: 0 auto;
        }
        .job-card {
            background: white;
            border-radius: 1rem;
            padding: 1.8rem;
            border: 1px solid var(--gray-200);
            transition: all 0.3s ease;
        }
        .job-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--accent);
        }
        .job-card .job-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }
        .job-card .job-title {
            font-family: var(--font-poppins);
            font-size: 1.1rem;
            color: var(--primary);
        }
        .job-card .job-type {
            background: rgba(230, 126, 34, 0.1);
            color: var(--accent);
            padding: 0.15rem 0.6rem;
            border-radius: 1rem;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .job-card .job-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            font-size: 0.8rem;
            color: var(--gray-500);
            margin-bottom: 0.8rem;
        }
        .job-card .job-meta i {
            margin-right: 0.3rem;
            color: var(--accent);
        }
        .job-card .job-description {
            font-size: 0.85rem;
            color: var(--gray-600);
            line-height: 1.6;
            margin-bottom: 1rem;
        }
        .job-card .job-actions {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        .btn-primary {
            background: var(--accent);
            color: white;
        }
        .btn-primary:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
        }
        .btn-outline:hover {
            background: var(--accent);
            color: white;
            transform: translateY(-2px);
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            margin-top: 2rem;
        }

        @media (max-width: 768px) {
            .page-header h1 {
                font-size: 2rem;
            }
            .section-title {
                font-size: 2rem;
            }
            .section {
                padding: 50px 0;
            }
            .jobs-grid {
                grid-template-columns: 1fr;
            }
            .job-filters {
                flex-wrap: nowrap;
                overflow-x: auto;
                justify-content: flex-start;
                padding-bottom: 0.5rem;
            }
            .job-filter-btn {
                white-space: nowrap;
                font-size: 0.75rem;
                padding: 0.4rem 0.8rem;
            }
        }

        @media (max-width: 480px) {
            .page-header h1 {
                font-size: 1.6rem;
            }
            .section-title {
                font-size: 1.7rem;
            }
            .job-card .job-header {
                flex-direction: column;
                gap: 0.5rem;
            }
        }

        [data-theme="dark"] body {
            background: #12121e;
            color: #e0e0e0;
        }
        [data-theme="dark"] .section-light {
            background: #1a1a2e;
        }
        [data-theme="dark"] .section-title {
            color: #e0e0e0;
        }
        [data-theme="dark"] .job-card {
            background: #2d2d44;
            border-color: #3d3d5c;
        }
        [data-theme="dark"] .job-card .job-title {
            color: #e0e0e0;
        }
        [data-theme="dark"] .job-card .job-description {
            color: #94a3b8;
        }
        [data-theme="dark"] .job-filter-btn {
            background: #2d2d44;
            border-color: #3d3d5c;
            color: #94a3b8;
        }
        [data-theme="dark"] .job-filter-btn:hover,
        [data-theme="dark"] .job-filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <section class="page-header">
        <div class="container">
            <h1>All Open <span>Positions</span></h1>
            <p>Find the role that fits your skills and career goals</p>
        </div>
    </section>

    <section class="section section-light">
        <div class="container">
            <div class="job-filters">
                <button class="job-filter-btn active" data-filter="all">All Positions</button>
                <button class="job-filter-btn" data-filter="engineering">Engineering</button>
                <button class="job-filter-btn" data-filter="sales">Sales</button>
                <button class="job-filter-btn" data-filter="support">Support</button>
                <button class="job-filter-btn" data-filter="management">Management</button>
                <button class="job-filter-btn" data-filter="internship">Internship</button>
            </div>

            <div class="jobs-grid" id="jobsGrid"></div>

            <div style="text-align:center; margin-top:2rem;">
                <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Careers</a>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 600, once: true, offset: 50 });

        const allJobs = [{
            id: 1,
            title: "Senior Software Developer",
            type: "Full-time",
            category: "engineering",
            location: "Kampala (Hybrid)",
            salary: "UGX 3,000,000 - 5,000,000",
            description: "We're looking for an experienced full-stack developer with PHP/Laravel and JavaScript skills to join our development team.",
            posted: "2 days ago"
        }, {
            id: 2,
            title: "Network Engineer",
            type: "Full-time",
            category: "engineering",
            location: "Kampala",
            salary: "UGX 2,500,000 - 4,000,000",
            description: "CCNA/CCNP certified engineer to manage client networks, fiber optics, and Starlink installations across Uganda.",
            posted: "5 days ago"
        }, {
            id: 3,
            title: "Cybersecurity Analyst",
            type: "Full-time",
            category: "engineering",
            location: "Remote",
            salary: "UGX 3,500,000 - 5,500,000",
            description: "Monitor security events, conduct penetration tests, and implement security policies for our clients.",
            posted: "1 week ago"
        }, {
            id: 4,
            title: "Sales Executive (IT Solutions)",
            type: "Full-time",
            category: "sales",
            location: "Kampala",
            salary: "UGX 1,500,000 + Commission",
            description: "Drive sales of IT services to SMEs and corporate clients. Experience in B2B tech sales required.",
            posted: "3 days ago"
        }, {
            id: 5,
            title: "Technical Support Engineer",
            type: "Full-time",
            category: "support",
            location: "Kampala",
            salary: "UGX 1,200,000 - 1,800,000",
            description: "Provide technical support to clients via phone, email, and WhatsApp. Troubleshoot hardware and software issues.",
            posted: "4 days ago"
        }, {
            id: 6,
            title: "IoT Engineer",
            type: "Contract",
            category: "engineering",
            location: "Kampala",
            salary: "Negotiable",
            description: "Design and deploy IoT solutions for smart agriculture and logistics tracking across Uganda.",
            posted: "1 week ago"
        }, {
            id: 7,
            title: "Sales Manager",
            type: "Full-time",
            category: "management",
            location: "Kampala",
            salary: "UGX 4,000,000 - 6,000,000",
            description: "Lead our sales team, develop strategies, and drive revenue growth. Experience in IT sales management required.",
            posted: "2 weeks ago"
        }, {
            id: 8,
            title: "Marketing Intern",
            type: "Internship",
            category: "internship",
            location: "Kampala",
            salary: "UGX 500,000 (Stipend)",
            description: "Join our marketing team to help create content, manage social media, and support campaigns.",
            posted: "3 days ago"
        }, {
            id: 9,
            title: "HR & Operations Manager",
            type: "Full-time",
            category: "management",
            location: "Kampala",
            salary: "UGX 3,500,000 - 5,000,000",
            description: "Manage HR functions and daily operations. Experience in people management and operational excellence required.",
            posted: "1 week ago"
        }];

        function renderJobs(filter = 'all') {
            const grid = document.getElementById('jobsGrid');
            const filtered = filter === 'all' ? allJobs : allJobs.filter(job => job.category === filter);

            if (filtered.length === 0) {
                grid.innerHTML =
                    `
                    <div style="grid-column:1/-1; text-align:center; padding:3rem; color:var(--gray-500);">
                        <i class="fas fa-search" style="font-size:2rem; display:block; margin-bottom:1rem;"></i>
                        <p>No positions found for this category.</p>
                        <p style="font-size:0.85rem;">Check back later for new opportunities.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(job => `
                    <div class="job-card" data-category="${job.category}">
                        <div class="job-header">
                            <h3 class="job-title">${job.title}</h3>
                            <span class="job-type">${job.type}</span>
                        </div>
                        <div class="job-meta">
                            <span><i class="fas fa-map-marker-alt"></i> ${job.location}</span>
                            <span><i class="fas fa-money-bill-wave"></i> ${job.salary}</span>
                            <span><i class="fas fa-clock"></i> ${job.posted}</span>
                        </div>
                        <p class="job-description">${job.description}</p>
                        <div class="job-actions">
                            <a href="detail.html?id=${job.id}" class="btn btn-primary">Apply Now</a>
                            <a href="detail.html?id=${job.id}" class="btn btn-outline">View Details</a>
                        </div>
                    </div>
                `).join('');
        }

        document.querySelectorAll('.job-filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.job-filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                renderJobs(this.dataset.filter);
            });
        });

        async function loadComponent(url, id) {
            try {
                const res = await fetch(url);
                const html = await res.text();
                document.getElementById(id).innerHTML = html;
                const scripts = document.querySelectorAll(`#${id} script`);
                scripts.forEach(old => {
                    const ns = document.createElement('script');
                    ns.textContent = old.textContent;
                    document.body.appendChild(ns);
                    old.remove();
                });
            } catch (e) { console.error(`Failed to load ${url}:`, e); }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadComponent('/components/header.html', 'header-placeholder');
            loadComponent('/components/footer.html', 'footer-placeholder');
            renderJobs('all');
        });
    </script>

</body>
</html>
