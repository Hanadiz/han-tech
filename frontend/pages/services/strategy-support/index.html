<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">Service</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #0b1a33; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        .section-padding { padding: 80px 0; }
        .section-padding-sm { padding: 48px 0; }
        #loading-overlay {
            position: fixed; inset: 0; background: rgba(255,255,255,0.92); backdrop-filter: blur(4px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.5s ease;
        }
        #loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .loading-icon { font-size: 3.2rem; color: #4f46e5; margin-bottom: 20px; animation: spin 1.2s cubic-bezier(0.5,0,0.5,1) infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loading-progress { width: 260px; height: 8px; background: #e2e8f0; border-radius: 8px; overflow: hidden; margin-top: 8px; }
        #loading-progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #4f46e5, #7c3aed, #a855f7); border-radius: 8px; transition: width 0.35s ease; }
        #loading-status { font-size: 0.95rem; font-weight: 500; color: #1e293b; margin-top: 16px; }
        .component-placeholder { padding: 60px 0; text-align: center; color: #94a3b8; }
        .component-placeholder i { font-size: 2rem; margin-bottom: 12px; display: block; }
        .component-error { border: 1px solid #fecaca; background: #fef2f2; border-radius: 16px; padding: 40px 20px; text-align: center; color: #991b1b; }
        .component-error i { font-size: 2.2rem; color: #dc2626; display: block; margin-bottom: 8px; }
        @media (max-width: 768px) { .section-padding { padding: 56px 0; } .section-padding-sm { padding: 32px 0; } }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="loading-icon"><i class="fas fa-cog"></i></div>
        <div id="loading-progress"><div id="loading-progress-bar"></div></div>
        <div id="loading-status">Loading components…</div>
    </div>
    <div id="app"></div>
    <script>
        (function() {
            'use strict';
            (function setTitle() {
                const parts = window.location.pathname.split('/').filter(p => p);
                let folder = parts[parts.length - 2] || 'Service';
                folder = folder.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
                document.title = folder + ' Services';
                const el = document.getElementById('page-title');
                if (el) el.textContent = folder + ' Services';
            })();
            const PARTIALS = [
                { id: 'hero', file: 'hero.html' },
                { id: 'overview', file: 'overview.html' },
                { id: 'service-list', file: 'service-list.html' },
                { id: 'features', file: 'features.html' },
                { id: 'benefits', file: 'benefits.html' },
                { id: 'use-cases', file: 'use-cases.html' },
                { id: 'pricing', file: 'pricing.html' },
                { id: 'faq', file: 'faq.html' },
                { id: 'cta', file: 'cta.html' },
            ];
            const TOTAL = PARTIALS.length;
            const app = document.getElementById('app');
            const overlay = document.getElementById('loading-overlay');
            const progressBar = document.getElementById('loading-progress-bar');
            const statusText = document.getElementById('loading-status');

            async function fetchWithRetry(url, retries = 2, delay = 500) {
                for (let i = 0; i <= retries; i++) {
                    try {
                        const res = await fetch(url);
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        return await res.text();
                    } catch (err) {
                        if (i === retries) throw err;
                        await new Promise(r => setTimeout(r, delay * (i + 1)));
                    }
                }
            }
            function renderPlaceholder(id) {
                const label = id.charAt(0).toUpperCase() + id.slice(1).replace('-', ' ');
                return `<div class="component-placeholder" data-component="${id}"><i class="fas fa-spinner fa-pulse"></i><span>Loading ${label}…</span></div>`;
            }
            function renderError(id, message) {
                return `<div class="component-error" data-component="${id}"><i class="fas fa-exclamation-triangle"></i><strong>Could not load “${id}”</strong><p style="font-size:0.85rem;margin-top:6px;color:#7f1d1d;">${message}</p></div>`;
            }
            async function assemble() {
                let placeholderHTML = '';
                PARTIALS.forEach(p => { placeholderHTML += renderPlaceholder(p.id); });
                app.innerHTML = placeholderHTML;
                let loaded = 0;
                const results = [];
                const fetchPromises = PARTIALS.map(async (p) => {
                    try {
                        const html = await fetchWithRetry(p.file, 2);
                        results.push({ id: p.id, html, ok: true, error: null });
                    } catch (err) {
                        results.push({ id: p.id, html: null, ok: false, error: err.message });
                    } finally {
                        loaded++;
                        const percent = Math.min(100, Math.round((loaded / TOTAL) * 100));
                        progressBar.style.width = percent + '%';
                        statusText.textContent = `${loaded} of ${TOTAL} components loaded`;
                        if (loaded === TOTAL) {
                            statusText.textContent = 'All components ready!';
                            setTimeout(() => overlay.classList.add('hidden'), 400);
                        }
                    }
                });
                await Promise.allSettled(fetchPromises);
                results.forEach((result) => {
                    const placeholderEl = app.querySelector(`[data-component="${result.id}"]`);
                    if (!placeholderEl) return;
                    if (result.ok) {
                        const wrapper = document.createElement('div');
                        wrapper.dataset.component = result.id;
                        wrapper.innerHTML = result.html;
                        const children = wrapper.children;
                        if (children.length === 1) { placeholderEl.replaceWith(children[0]); }
                        else {
                            const container = document.createElement('div');
                            container.dataset.component = result.id;
                            while (wrapper.firstChild) container.appendChild(wrapper.firstChild);
                            placeholderEl.replaceWith(container);
                        }
                    } else {
                        placeholderEl.outerHTML = renderError(result.id, result.error || 'Unknown error');
                    }
                });
                document.dispatchEvent(new CustomEvent('infrastructure:assembled', { detail: { results } }));
                console.log(`✅ ${document.title} assembled.`);
            }
            assemble().catch((err) => {
                console.error(err);
                overlay.classList.add('hidden');
                app.innerHTML = `<div style="padding:80px 24px;text-align:center;max-width:600px;margin:0 auto;color:#991b1b;"><i class="fas fa-circle-exclamation" style="font-size:3rem;color:#dc2626;margin-bottom:16px;display:block;"></i><h2 style="font-size:1.5rem;font-weight:700;margin-bottom:8px;">Assembly failed</h2><pre style="margin-top:16px;background:#fef2f2;padding:16px;border-radius:8px;font-size:0.8rem;overflow:auto;text-align:left;">${err.message}</pre></div>`;
            });
        })();
    </script>
</body>
</html>
