<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infrastructure Services</title>

    <!-- Google Fonts & Font Awesome (same as before) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ----- Reset & Base ----- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            color: #0b1a33;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }
        .section-padding {
            padding: 80px 0;
        }
        .section-padding-sm {
            padding: 48px 0;
        }

        /* ----- Loading overlay (progress) ----- */
        #loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }
        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loading-overlay .spinner {
            font-size: 2.8rem;
            color: #2563eb;
            margin-bottom: 16px;
        }
        #loading-progress {
            width: 240px;
            height: 6px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }
        #loading-progress-bar {
            height: 100%;
            width: 0%;
            background: #2563eb;
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        #loading-status {
            font-size: 0.95rem;
            color: #475569;
            margin-top: 12px;
            font-weight: 500;
        }

        /* ----- Placeholder for components ----- */
        .component-placeholder {
            padding: 60px 0;
            text-align: center;
            color: #94a3b8;
        }
        .component-placeholder i {
            font-size: 2rem;
            margin-bottom: 12px;
            display: block;
        }
        .component-error {
            border: 1px solid #fee2e2;
            background: #fef2f2;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            color: #991b1b;
        }
        .component-error i {
            font-size: 2rem;
            color: #dc2626;
            display: block;
            margin-bottom: 8px;
        }

        @media (max-width: 768px) {
            .section-padding {
                padding: 56px 0;
            }
            .section-padding-sm {
                padding: 32px 0;
            }
        }
    </style>
</head>
<body>

    <!-- Loading overlay with progress -->
    <div id="loading-overlay">
        <div class="spinner"><i class="fas fa-cog fa-spin"></i></div>
        <div id="loading-progress"><div id="loading-progress-bar"></div></div>
        <div id="loading-status">Preparing infrastructure…</div>
    </div>

    <!-- Main app container -->
    <div id="app"></div>

    <script>
        (function() {
            'use strict';

            // ----------------------------------------------------------------
            // 1. Configuration – all partials are in the same folder as this index.html
            //    (no "infrastructure/" prefix)
            // ----------------------------------------------------------------
            const PARTIALS = [
                { id: 'hero', file: 'hero.html' },
                { id: 'overview', file: 'overview.html' },
                { id: 'service-list', file: 'service-list.html' },
                { id: 'features', file: 'features.html' },
                { id: 'benefits', file: 'benefits.html' },
                { id: 'use-cases', file: 'use-cases.html' },
                { id: 'pricing', file: 'pricing.html' },
                { id: 'faq', file: 'faq.html' },
                { id: 'cta', file: 'cta.html' },
            ];

            const TOTAL = PARTIALS.length;
            const app = document.getElementById('app');
            const overlay = document.getElementById('loading-overlay');
            const progressBar = document.getElementById('loading-progress-bar');
            const statusText = document.getElementById('loading-status');

            // ----------------------------------------------------------------
            // 2. Helper: fetch with retries
            // ----------------------------------------------------------------
            async function fetchWithRetry(url, retries = 2, delay = 500) {
                for (let i = 0; i <= retries; i++) {
                    try {
                        const response = await fetch(url);
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        return await response.text();
                    } catch (err) {
                        if (i === retries) throw err;
                        await new Promise(resolve => setTimeout(resolve, delay * (i + 1)));
                    }
                }
            }

            // ----------------------------------------------------------------
            // 3. Render a placeholder (loading state)
            // ----------------------------------------------------------------
            function renderPlaceholder(id) {
                const label = id.charAt(0).toUpperCase() + id.slice(1).replace('-', ' ');
                return `<div class="component-placeholder" data-component="${id}">
                            <i class="fas fa-spinner fa-pulse"></i>
                            <span>Loading ${label}…</span>
                        </div>`;
            }

            // ----------------------------------------------------------------
            // 4. Render an error fallback
            // ----------------------------------------------------------------
            function renderError(id, message) {
                return `<div class="component-error" data-component="${id}">
                            <i class="fas fa-exclamation-triangle"></i>
                            <strong>Could not load “${id}”</strong>
                            <p style="font-size:0.85rem;margin-top:4px;color:#7f1d1d;">${message}</p>
                        </div>`;
            }

            // ----------------------------------------------------------------
            // 5. Main assembly with progress tracking
            // ----------------------------------------------------------------
            async function assemble() {
                // --- 5a. Show placeholders immediately ---
                let placeholderHTML = '';
                PARTIALS.forEach(p => {
                    placeholderHTML += renderPlaceholder(p.id);
                });
                app.innerHTML = placeholderHTML;

                // --- 5b. Fetch all partials in parallel, track progress ---
                let loaded = 0;
                const results = [];

                const fetchPromises = PARTIALS.map(async (p) => {
                    try {
                        const html = await fetchWithRetry(p.file, 2);
                        results.push({ id: p.id, html, ok: true, error: null });
                    } catch (err) {
                        results.push({ id: p.id, html: null, ok: false, error: err.message });
                    } finally {
                        loaded++;
                        const percent = Math.round((loaded / TOTAL) * 100);
                        progressBar.style.width = percent + '%';
                        statusText.textContent = `Loading ${loaded} of ${TOTAL} components…`;
                        if (loaded === TOTAL) {
                            statusText.textContent = 'All components loaded!';
                            setTimeout(() => {
                                overlay.classList.add('hidden');
                            }, 400);
                        }
                    }
                });

                await Promise.allSettled(fetchPromises);

                // --- 5c. Replace placeholders with real content or error ---
                results.forEach((result) => {
                    const placeholderEl = app.querySelector(`[data-component="${result.id}"]`);
                    if (!placeholderEl) return;

                    if (result.ok) {
                        // Wrap the partial HTML in a container with data-component
                        const wrapper = document.createElement('div');
                        wrapper.dataset.component = result.id;
                        wrapper.innerHTML = result.html;

                        // If the partial has a single root element, use it; otherwise wrap all children
                        const children = wrapper.children;
                        if (children.length === 1) {
                            placeholderEl.replaceWith(children[0]);
                        } else {
                            // Create a fragment and move all children
                            const fragment = document.createDocumentFragment();
                            while (wrapper.firstChild) {
                                fragment.appendChild(wrapper.firstChild);
                            }
                            const container = document.createElement('div');
                            container.dataset.component = result.id;
                            container.appendChild(fragment);
                            placeholderEl.replaceWith(container);
                        }
                    } else {
                        placeholderEl.outerHTML = renderError(result.id, result.error || 'Unknown error');
                    }
                });

                // --- 5d. Dispatch event for any post-load scripts ---
                document.dispatchEvent(new CustomEvent('infrastructure:assembled', {
                    detail: { results }
                }));

                console.log('✅ Infrastructure page fully assembled.');
            }

            // ----------------------------------------------------------------
            // 6. Start assembly
            // ----------------------------------------------------------------
            assemble().catch((err) => {
                console.error('Fatal assembly error:', err);
                overlay.classList.add('hidden');
                app.innerHTML = `
                        <div style="padding:80px 24px;text-align:center;max-width:600px;margin:0 auto;color:#991b1b;">
                            <i class="fas fa-circle-exclamation" style="font-size:3rem;color:#dc2626;margin-bottom:16px;display:block;"></i>
                            <h2 style="font-size:1.5rem;font-weight:700;margin-bottom:8px;">Assembly failed</h2>
                            <p>Please check the console for details or verify that all partial files exist.</p>
                            <pre style="margin-top:16px;background:#fef2f2;padding:16px;border-radius:8px;font-size:0.8rem;overflow:auto;text-align:left;">${err.message || 'Unknown error'}</pre>
                        </div>
                    `;
            });

        })();
    </script>

</body>
</html>
