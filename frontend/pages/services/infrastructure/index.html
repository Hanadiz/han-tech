<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Infrastructure | Han-Tech Ltd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --tech-blue: #0077b6; --gradient-tech: linear-gradient(135deg, #0077b6, #00b4d8); --gradient-dark: linear-gradient(135deg, #0f0f1a, #1a1a2e, #16213e); }
        body { font-family: 'Inter', sans-serif; background: #f9fafb; color: #2c3e50; }
        .section { padding: 80px 0; }
        .service-card { background: #fff; border-radius: 20px; padding: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.3s; height: 100%; text-align: center; }
        [data-theme="dark"] .service-card { background: #1a1a2e; }
        .service-card:hover { transform: translateY(-5px); }
        .icon-box { width: 60px; height: 60px; background: var(--gradient-tech); border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.6rem; margin: 0 auto 20px; }
    </style>
</head>
<body>
    <div id="header-container"></div>
    <div id="hero-container"></div>

    <!-- All sub‑sections will be loaded here -->
    <div id="overview-container"></div>
    <div id="service-list-container"></div>
    <div id="features-container"></div>
    <div id="benefits-container"></div>
    <div id="use-cases-container"></div>
    <div id="pricing-container"></div>
    <div id="faq-container"></div>
    <div id="cta-container"></div>

    <div id="footer-container"></div>

    <button class="back-to-top" id="backToTop" aria-label="Back to top">
        <i class="bi bi-arrow-up"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function load(url, containerId) {
            try {
                const r = await fetch(url);
                document.getElementById(containerId).innerHTML = await r.text();
            } catch(e) { console.error(e); }
        }

        (async function() {
            await load('/components/layouts/header.html', 'header-container');
            await load('/components/layouts/footer.html', 'footer-container');
            await load('hero.html', 'hero-container');
            await load('overview.html', 'overview-container');
            await load('service-list.html', 'service-list-container');
            await load('features.html', 'features-container');
            await load('benefits.html', 'benefits-container');
            await load('use-cases.html', 'use-cases-container');
            await load('pricing.html', 'pricing-container');
            await load('faq.html', 'faq-container');
            await load('cta.html', 'cta-container');

            // Back-to-top button
            const backBtn = document.getElementById('backToTop');
            window.addEventListener('scroll', () => backBtn.classList.toggle('visible', window.scrollY > 400));
            backBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

            // Inject back-to-top CSS if not already present
            if (!document.getElementById('back-to-top-css')) {
                const style = document.createElement('style');
                style.id = 'back-to-top-css';
                style.textContent = `.back-to-top { position:fixed; bottom:30px; right:30px; width:48px; height:48px; background:linear-gradient(135deg,#0077b6,#00b4d8); color:#fff; border:2px solid rgba(255,255,255,0.2); border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:1.2rem; cursor:pointer; z-index:999; opacity:0; visibility:hidden; transform:translateY(20px); transition:all 0.3s ease; box-shadow:0 10px 15px -3px rgba(0,0,0,0.1); } .back-to-top.visible { opacity:1; visibility:visible; transform:translateY(0); } .back-to-top:hover { transform:translateY(-4px)!important; box-shadow:0 25px 50px -12px rgba(0,0,0,0.25), 0 0 20px rgba(0,180,216,0.3); }`;
                document.head.appendChild(style);
            }
        })();
    </script>
</body>
</html>
