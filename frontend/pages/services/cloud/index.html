<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud & Virtualization | Han-Tech Ltd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --tech-blue: #0077b6; --gradient-tech: linear-gradient(135deg, #0077b6, #00b4d8); --gradient-dark: linear-gradient(135deg, #0f0f1a, #1a1a2e, #16213e); }
        body { font-family: 'Inter', sans-serif; background: #f9fafb; color: #2c3e50; }
        .category-hero { background: var(--gradient-dark); color: #fff; padding: 100px 0 60px; text-align: center; }
        .category-hero h1 { font-family: 'Poppins', sans-serif; font-size: 3rem; font-weight: 700; }
        .section { padding: 80px 0; }
        .service-card { background: #fff; border-radius: 20px; padding: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.3s; height: 100%; text-align: center; }
        [data-theme="dark"] .service-card { background: #1a1a2e; }
        .service-card:hover { transform: translateY(-5px); }
        .icon-box { width: 60px; height: 60px; background: var(--gradient-tech); border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.6rem; margin: 0 auto 20px; }
    </style>
</head>
<body>
    <div id="header-container"></div>

    <section class="category-hero">
        <div class="container">
            <h1>Cloud & Virtualization</h1>
            <p>GCP, AWS, Azure, private cloud, Kubernetes & serverless solutions.</p>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <div class="row g-4">
                <div class="col-md-6 col-lg-4">
                    <div class="service-card">
                        <div class="icon-box"><i class="fab fa-aws"></i></div>
                        <h5>AWS Migration</h5>
                    </div>
                </div>
                <div class="col-md-6 col-lg-4">
                    <div class="service-card">
                        <div class="icon-box"><i class="fab fa-microsoft"></i></div>
                        <h5>Azure Migration</h5>
                    </div>
                </div>
                <div class="col-md-6 col-lg-4">
                    <div class="service-card">
                        <div class="icon-box"><i class="fas fa-cloud"></i></div>
                        <h5>Private Cloud</h5>
                    </div>
                </div>
                <div class="col-md-6 col-lg-4">
                    <div class="service-card">
                        <div class="icon-box"><i class="fas fa-dharmachakra"></i></div>
                        <h5>Kubernetes & Docker</h5>
                    </div>
                </div>
                <div class="col-md-6 col-lg-4">
                    <div class="service-card">
                        <div class="icon-box"><i class="fas fa-server"></i></div>
                        <h5>Disaster Recovery as a Service</h5>
                    </div>
                </div>
                <div class="col-md-6 col-lg-4">
                    <div class="service-card">
                        <div class="icon-box"><i class="fas fa-chart-line"></i></div>
                        <h5>Cloud Cost Optimisation</h5>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function load(u,i){ try { const r=await fetch(u); document.getElementById(i).innerHTML=await r.text(); } catch(e){} }
        load('/components/layouts/header.html','header-container');
        load('/components/layouts/footer.html','footer-container');
    </script>
</body>
</html>
