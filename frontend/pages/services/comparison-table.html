<style>
    .comparison-table {
        padding: 80px 0;

        overflow-x: auto;

        border-radius: 16px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 700px;
    }

    [data-theme="dark"] tbody tr:nth-child(even) td { background: #0f0f1a; }
