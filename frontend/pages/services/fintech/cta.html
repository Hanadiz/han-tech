<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTech CTA | Han-Tech Ltd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>.cta-section{background:linear-gradient(135deg,#0077b6,#00b4d8);color:#fff;padding:80px 0;text-align:center}.cta-section h2{font-family:'Poppins',sans-serif;font-size:2.5rem;font-weight:700}.btn-light{padding:14px 36px;border-radius:50px;font-weight:600;background:#fff;color:#0077b6;text-decoration:none}</style>
</head>
<body>
    <div id="header-container"></div>
    <section class="cta-section"><div class="container"><h2>Ready to launch your fintech product?</h2><p class="mt-3">Let's build the future of payments together.</p><a href="/pages/contact/" class="btn btn-light mt-4">Start Your Project</a></div></section>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>async function load(u,i){try{const r=await fetch(u);document.getElementById(i).innerHTML=await r.text()}catch(e){}}load('/components/layouts/header.html','header-container');load('/components/layouts/footer.html','footer-container')</script>
</body>
</html>
