<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ | Han-Tech Ltd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f9fafb; color: #2c3e50; }
        .page-hero { background: linear-gradient(135deg, #0f0f1a, #1a1a2e, #16213e); color: #fff; padding: 100px 0 60px; text-align: center; }
    </style>
</head>
<body>
    <div id="header-container"></div>
    <section class="page-hero"><h1>FAQ</h1></section>
    <div id="faq-categories-container"></div>
    <div id="search-faq-container"></div>
    <div id="faq-accordion-container"></div>
    <div id="still-questions-container"></div>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function load(u,i){ try{ const r=await fetch(u); document.getElementById(i).innerHTML=await r.text(); }catch(e){} }
        (async()=>{
            await load('/components/layouts/header.html','header-container');
            await load('/pages/faq/faq-categories.html','faq-categories-container');
            await load('/pages/faq/search-faq.html','search-faq-container');
            await load('/pages/faq/faq-accordion.html','faq-accordion-container');
            await load('/pages/faq/still-questions.html','still-questions-container');
            await load('/components/layouts/footer.html','footer-container');
        })();
    </script>
</body>
</html>
