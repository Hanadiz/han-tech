<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Han-Tech Ltd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f9fafb; color: #2c3e50; }
        .page-hero { background: linear-gradient(135deg, #0f0f1a, #1a1a2e, #16213e); color: #fff; padding: 100px 0 60px; text-align: center; }
        .page-hero h1 { font-family: 'Poppins', sans-serif; font-size: 3rem; font-weight: 700; }
    </style>
</head>
<body>
    <div id="header-container"></div>
    <section class="page-hero"><div class="container"><h1>Our Portfolio</h1><p>Showcasing our finest work</p></div></section>
    <div id="filter-bar-container"></div>
    <div id="project-grid-container"></div>
    <div id="client-logos-container"></div>
    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function load(url, id) { try { const r = await fetch(url); document.getElementById(id).innerHTML = await r.text(); } catch(e){} }
        (async () => {
            await load('/components/layouts/header.html', 'header-container');
            await load('/pages/portfolio/filter-bar.html', 'filter-bar-container');
            await load('/pages/portfolio/project-grid.html', 'project-grid-container');
            await load('/pages/portfolio/client-logos.html', 'client-logos-container');
            await load('/components/layouts/footer.html', 'footer-container');
        })();
    </script>
</body>
</html>
