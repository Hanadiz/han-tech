    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; background: #f5f7fa; }
        .page-hero { background: linear-gradient(135deg, #0f0f1a, #1a1a2e, #16213e); color: #fff; padding: 80px 0 50px; text-align: center; }
        .page-hero h1 { font-family: 'Poppins', sans-serif; font-size: 2.8rem; font-weight: 700; }
        .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; padding: 40px 0 60px; }
        .project-card {
            background: #fff; border-radius: 20px; padding: 28px; box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            transition: transform 0.3s ease, box-shadow 0.3s ease; position: relative; overflow: hidden;
        }
        [data-theme="dark"] .project-card { background: #1a1a2e; }
        .project-card:hover { transform: translateY(-6px); box-shadow: 0 12px 30px rgba(0,0,0,0.1); }
        .project-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            transform: scaleX(0); transition: transform 0.4s;
        }
        .project-card:hover::before { transform: scaleX(1); }
        .project-card h5 { font-family: 'Poppins', sans-serif; font-weight: 600; margin-bottom: 12px; }
        .badge-category { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; background: #eef2ff; color: #0077b6; display: inline-block; margin-bottom: 10px; }
        [data-theme="dark"] .badge-category { background: #252540; color: #90e0ef; }
        .product-status { font-size: 0.8rem; font-weight: 600; position: absolute; bottom: 20px; right: 20px; }
        .stats-bar { display: flex; justify-content: center; gap: 40px; margin: 30px 0; color: #fff; flex-wrap: wrap; }
        .stat-item { text-align: center; }
        .stat-number { font-family: 'Poppins', sans-serif; font-size: 2.2rem; font-weight: 700; }
    </style>
</head>
<body>
    <div id="header-container"></div>

    <section class="page-hero">
        <div class="container">
            <h1>Our Portfolio</h1>
            <p>Explore 60+ live products, platforms, and hardware.</p>
            <div class="stats-bar">
                <div class="stat-item"><div class="stat-number" id="countDeployed">12</div>Live Products</div>
                <div class="stat-item"><div class="stat-number" id="countDev">12</div>In Development</div>
                <div class="stat-item"><div class="stat-number" id="countPlanned">16</div>Planned</div>
            </div>
        </div>
    </section>

    <!-- Scrollable Tabs -->

    </div>

        // ========== RENDER CARDS ==========
        function filterProjects(category) {
            const grid = document.getElementById('projectGrid');
            grid.innerHTML = '';
            const filtered = products.filter(p => !category || p.status === category);
            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <div class="d-flex align-items-center mb-3">
                        <i class="${p.icon} fa-2x me-3" style="color:#0077b6;"></i>
                        <div>
                            <h5 class="mb-1">${p.name}</h5>
                            <span class="badge-category">${p.category}</span>
                        </div>
                    </div>
                    <p class="text-muted small">${p.description}</p>
                    <div class="product-status">
                        ${p.status === 'deployed' ? '<span class="text-success"><i class="fas fa-check-circle"></i> Live</span>' : ''}
                        ${p.status === 'development' ? '<span class="text-warning"><i class="fas fa-cogs"></i> In Progress</span>' : ''}
                        ${p.status === 'proposed' ? '<span class="text-secondary"><i class="fas fa-lightbulb"></i> Planned</span>' : ''}
                        ${p.status === 'hardware' ? '<span class="text-info"><i class="fas fa-box"></i> Available</span>' : ''}
                        ${p.status === 'saas' ? '<span class="text-primary"><i class="fas fa-cloud"></i> Subscription</span>' : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        window.filterProjects = filterProjects;

        async function load(url, id) {
            try { const r = await fetch(url); document.getElementById(id).innerHTML = await r.text(); } catch(e) {}
        }
        (async () => {
            await load('/components/layouts/header.html', 'header-container');
            await load('/components/ui/scrollable-tabs.html', 'tabs-container');
            await load('/components/layouts/footer.html', 'footer-container');
            filterProjects('deployed');
        })();
    </script>
</body>
</html>
