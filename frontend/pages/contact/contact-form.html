<style>
    .contact-form-section { padding: 80px 0; background: #fff; }
    [data-theme="dark"] .contact-form-section { background: #1a1a2e; }
    .form-control { border-radius: 12px; border: 2px solid #e0e0e0; padding: 12px 18px; }
    [data-theme="dark"] .form-control { background: #0f0f1a; border-color: #2a2a40; color: #e0e0e0; }
    .btn-primary { background: linear-gradient(135deg, #0077b6, #00b4d8); border: none; padding: 14px 30px; border-radius: 50px; font-weight: 600; }
</style>
<section class="contact-form-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h2>Send Us a Message</h2>
                <form>
                    <div class="mb-3"><label>Full Name</label><input type="text" class="form-control" placeholder="Your name"></div>
                    <div class="mb-3"><label>Email</label><input type="email" class="form-control" placeholder="you@example.com"></div>
                    <div class="mb-3"><label>Message</label><textarea class="form-control" rows="5" placeholder="How can we help?"></textarea></div>
                    <button type="submit" class="btn btn-primary">Send Message</button>
                </form>
            </div>
        </div>
    </div>
</section>
