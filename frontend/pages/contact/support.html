<!-- pages/contact/support.html -->
<style>
    .hsp-section { max-width: 900px; margin: 0 auto; padding: 40px 0; }
    .hsp-header { text-align: center; margin-bottom: 40px; }
    .hsp-header h2 { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 1.8rem; color: #1e293b; }
    [data-theme="dark"] .hsp-header h2 { color: #fff; }
    .hsp-header p { color: #64748b; }
    [data-theme="dark"] .hsp-header p { color: rgba(255,255,255,0.5); }
    .hsp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 24px; }
    .hsp-card { background: #fff; border-radius: 20px; padding: 32px 24px; text-align: center; border: 1px solid #e2e8f0; transition: all 0.3s; }
    [data-theme="dark"] .hsp-card { background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.06); }
    .hsp-card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0,0,0,0.1); }
    .hsp-icon { width: 64px; height: 64px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 26px; margin-bottom: 16px; }
    .hsp-card h3 { font-family: 'Poppins', sans-serif; font-weight: 600; color: #1e293b; margin-bottom: 8px; }
    [data-theme="dark"] .hsp-card h3 { color: #fff; }
    .hsp-card p { color: #64748b; font-size: 0.9rem; margin-bottom: 16px; }
    [data-theme="dark"] .hsp-card p { color: rgba(255,255,255,0.5); }
    .hsp-btn { display: inline-block; padding: 10px 22px; background: linear-gradient(135deg, #0077b6, #00b4d8); color: #fff; border-radius: 50px; font-weight: 600; font-size: 0.85rem; text-decoration: none; transition: all 0.3s; }
    .hsp-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,119,182,0.3); color: #fff; }
</style>

<div class="hsp-section">
    <div class="hsp-header">
        <h2>Technical Support</h2>
        <p>We're here to help with any technical issues.</p>
    </div>
    <div class="hsp-grid">
        <div class="hsp-card">
            <div class="hsp-icon" style="background:rgba(0,119,182,0.1);color:#0077b6;"><i class="bi bi-book"></i></div>
            <h3>Knowledge Base</h3><p>Find answers to common questions.</p>
            <a href="/pages/support/knowledge-base/" class="hsp-btn">Browse Articles</a>
        </div>
        <div class="hsp-card">
            <div class="hsp-icon" style="background:rgba(16,185,129,0.1);color:#10b981;"><i class="bi bi-chat-dots"></i></div>
            <h3>Live Chat</h3><p>Chat with us in real-time.</p>
            <a href="/pages/support/live-chat.html" class="hsp-btn">Start Chat</a>
        </div>
        <div class="hsp-card">
            <div class="hsp-icon" style="background:rgba(245,158,11,0.1);color:#f59e0b;"><i class="bi bi-ticket-perforated"></i></div>
            <h3>Submit Ticket</h3><p>Get help within 4 hours.</p>
            <a href="/pages/support/submit-ticket.html" class="hsp-btn">Create Ticket</a>
        </div>
    </div>
</div>
