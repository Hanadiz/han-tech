<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Han-Tech Ltd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f9fafb; color: #2c3e50; }
        .page-hero { background: linear-gradient(135deg, #0f0f1a, #1a1a2e, #16213e); color: #fff; padding: 100px 0 60px; text-align: center; }
        .page-hero h1 { font-family: 'Poppins', sans-serif; font-size: 3rem; }
    </style>
</head>
<body>
    <div id="header-container"></div>
    <section class="page-hero"><div class="container"><h1>Get in Touch</h1><p>We'd love to hear from you</p></div></section>
    <div id="contact-form-container"></div>
    <div id="contact-info-container"></div>
    <div id="map-container"></div>
    <div id="hours-container"></div>
    <div id="social-container"></div>
    <div id="newsletter-container"></div>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function load(u,i){ try{ const r=await fetch(u); document.getElementById(i).innerHTML=await r.text(); }catch(e){} }
        (async()=>{
            await load('/components/layouts/header.html','header-container');
            await load('/pages/contact/contact-form.html','contact-form-container');
            await load('/pages/contact/contact-info.html','contact-info-container');
            await load('/pages/contact/map-section.html','map-container');
            await load('/pages/contact/office-hours.html','hours-container');
            await load('/pages/contact/social-links.html','social-container');
            await load('/pages/contact/newsletter-signup.html','newsletter-container');
            await load('/components/layouts/footer.html','footer-container');
        })();
    </script>
</body>
</html>
