<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Han-Tech Ltd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; color: #333; margin: 0; }
        [data-theme="dark"] body { background: #0f0f1a; color: #e0e0e0; }
        .back-to-top {
            position: fixed; bottom: 30px; right: 30px;
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            color: #fff; border: 2px solid rgba(255,255,255,0.2);
            border-radius: 14px; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; cursor: pointer; z-index: 999;
            opacity: 0; visibility: hidden; transform: translateY(20px);
            transition: all 0.3s ease; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        .back-to-top.visible { opacity: 1; visibility: visible; transform: translateY(0); }
        .back-to-top:hover { transform: translateY(-4px) !important; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
    </style>
</head>
<body>
    <div id="header-container"></div>
    <div id="hero-container"></div>
    <div id="contact-info-container"></div>
    <div id="contact-form-container"></div>
    <div id="map-container"></div>
    <div id="office-hours-container"></div>
    <div id="social-container"></div>
    <div id="newsletter-container"></div>
    <div id="footer-container"></div>

    <button class="back-to-top" id="backToTop" aria-label="Back to top">
        <i class="bi bi-arrow-up"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function load(url, containerId) {
            try {
                const r = await fetch(url);
                document.getElementById(containerId).innerHTML = await r.text();
            } catch(e) { console.error(e); }
        }

        (async function() {
            await load('/components/layouts/header.html', 'header-container');
            await load('/components/layouts/footer.html', 'footer-container');
            await load('/pages/contact/hero.html', 'hero-container');
            await load('/pages/contact/contact-info.html', 'contact-info-container');
            await load('/pages/contact/contact-form.html', 'contact-form-container');
            await load('/pages/contact/map-section.html', 'map-container');
            await load('/pages/contact/office-hours.html', 'office-hours-container');
            await load('/pages/contact/social-links.html', 'social-container');
            await load('/pages/contact/newsletter-signup.html', 'newsletter-container');

            const backBtn = document.getElementById('backToTop');
            window.addEventListener('scroll', () => backBtn.classList.toggle('visible', window.scrollY > 400));
            backBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
        })();
    </script>
</body>
</html>
