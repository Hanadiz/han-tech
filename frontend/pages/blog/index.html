<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Han-Tech Ltd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f9fafb; color: #2c3e50; }
        .page-hero { background: linear-gradient(135deg, #0f0f1a, #1a1a2e, #16213e); color: #fff; padding: 100px 0 60px; text-align: center; }
        .blog-card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.3s; height: 100%; }
        [data-theme="dark"] .blog-card { background: #1a1a2e; }
        .blog-card:hover { transform: translateY(-5px); }
        .blog-card img { width: 100%; height: 200px; object-fit: cover; }
        .blog-card .body { padding: 20px; }
    </style>
</head>
<body>
    <div id="header-container"></div>
    <section class="page-hero"><h1>Our Blog</h1></section>
    <section class="py-5"><div class="container"><div class="row g-4">
        <div class="col-md-4"><a href="post.html" class="blog-card text-decoration-none text-dark"><img src="https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=400" alt=""><div class="body"><span class="text-muted">June 10</span><h5>5 Cloud Migration Tips</h5></div></a></div>
        <div class="col-md-4"><a href="post.html" class="blog-card text-decoration-none text-dark"><img src="https://images.unsplash.com/photo-1563013544-824ae1b704d3?w=400" alt=""><div class="body"><span class="text-muted">May 28</span><h5>Zero‑Trust Security Explained</h5></div></a></div>
        <div class="col-md-4"><a href="post.html" class="blog-card text-decoration-none text-dark"><img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=400" alt=""><div class="body"><span class="text-muted">May 15</span><h5>IoT in Agriculture</h5></div></a></div>
    </div></div></section>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function load(u,i){ try{ const r=await fetch(u); document.getElementById(i).innerHTML=await r.text(); }catch(e){} }
        load('/components/layouts/header.html','header-container');
        load('/components/layouts/footer.html','footer-container');
    </script>
</body>
</html>
