<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post | Han-Tech Ltd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f9fafb; color: #2c3e50; }
        .post-header { padding: 60px 0; background: #fff; }
        [data-theme="dark"] .post-header { background: #1a1a2e; }
        .post-header h1 { font-family: 'Poppins', sans-serif; font-size: 2.5rem; font-weight: 700; }
        .post-content { padding: 40px 0; max-width: 800px; margin: 0 auto; }
    </style>
</head>
<body>
    <div id="header-container"></div>
    <section class="post-header"><div class="container"><h1>5 Cloud Migration Tips</h1><p class="text-muted">Published on June 10, 2025</p></div></section>
    <div class="post-content container"><p>Full article content…</p></div>
    <div id="related-posts-container"></div>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function load(u,i){ try{ const r=await fetch(u); document.getElementById(i).innerHTML=await r.text(); }catch(e){} }
        load('/components/layouts/header.html','header-container');
        load('/pages/blog/related-posts.html','related-posts-container');
        load('/components/layouts/footer.html','footer-container');
    </script>
</body>
</html>
