<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Han-Tech Ltd</title>
    <meta name="description" content="Explore Han-Tech Ltd products: Cloud Suite, SecureNet Firewall, IoT Kit, EduLearn LMS, FinPay Gateway, and more.">
    <meta name="theme-color" content="#0a1628">

    <!-- External CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        :root {
            --tech-blue: #0077b6;
            --gradient-tech: linear-gradient(135deg, #0077b6, #00b4d8);
            --gradient-dark: linear-gradient(135deg, #0f0f1a, #1a1a2e, #16213e);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f9fafb;
            color: #2c3e50;
        }

        [data-theme="dark"] body {
            background: #0a1628;
            color: #fff;
        }

        /* Hero */
        .prod-hero {
            background: var(--gradient-dark);
            color: #fff;
            padding: 100px 0 60px;
            text-align: center;
        }
        .prod-hero h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 3rem;
            font-weight: 700;
        }
        .prod-hero p {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 700px;
            margin: 20px auto 0;
        }
        .btn-hero {
            background: #fff;
            color: #0f0f1a;
            border-radius: 50px;
            padding: 14px 36px;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn-hero:hover {
            background: #e9ecef;
            transform: translateY(-2px);
        }

        /* Product Cards (like program cards) */
        .section {
            padding: 80px 0;
        }
        .product-card {
            background: #fff;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: 0.3s;
            height: 100%;
            text-align: center;
            border: 2px solid transparent;
            cursor: pointer;
        }
        [data-theme="dark"] .product-card {
            background: #1a1a2e;
        }
        .product-card:hover {
            transform: translateY(-8px);
            border-color: rgba(0,180,216,0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .product-icon {
            width: 70px;
            height: 70px;
            background: var(--gradient-tech);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 2rem;
            margin: 0 auto 20px;
        }
        .product-card h3 {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .product-card p {
            color: #666;
        }
        [data-theme="dark"] .product-card p {
            color: #94a3b8;
        }
        .product-category {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #f4a261;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .product-price {
            font-weight: 700;
            color: #0077b6;
            margin: 10px 0;
            font-size: 1.1rem;
        }
        [data-theme="dark"] .product-price {
            color: #00b4d8;
        }

        /* Stats Bar */
        .stats-bar {
            background: var(--gradient-tech);
            padding: 50px 0;
            color: #fff;
            text-align: center;
        }
        .stats-bar h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
        }

        /* Filter bar */
        .filter-bar {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            margin: 2rem 0;
        }
        .search-box {
            position: relative;
            flex: 1;
            max-width: 350px;
            min-width: 200px;
        }
        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.75rem;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 0.9rem;
        }
        [data-theme="dark"] .search-box input {
            background: #1a1a2e;
            border-color: rgba(255,255,255,0.1);
            color: #fff;
        }
        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
        }
        .filter-select {
            padding: 0.75rem 1rem;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 0.9rem;
            cursor: pointer;
            min-width: 150px;
        }
        [data-theme="dark"] .filter-select {
            background: #1a1a2e;
            border-color: rgba(255,255,255,0.1);
            color: #fff;
        }

        .no-results {
            text-align: center;
            padding: 3rem;
            color: #6b7280;
            display: none;
        }
        .no-results.show { display: block; }
    </style>
</head>
<body>

    <!-- Header dynamically loaded -->
    <div id="header-container"></div>

    <!-- Hero -->
    <section class="prod-hero">
        <div class="container">
            <h1>Our Technology Products</h1>
            <p>Ready‑to‑deploy solutions that accelerate your digital transformation.</p>
            <a href="/pages/pricing/" class="btn btn-hero btn-lg mt-4">View Pricing</a>
        </div>
    </section>

    <!-- Product Grid Section -->
    <section class="section">
        <div class="container">
            <!-- Filter bar -->
            <div class="filter-bar">
                <div class="search-box">
                    <i class="bi bi-search"></i>
                    <input type="text" id="searchInput" placeholder="Search products...">
                </div>
                <select class="filter-select" id="categoryFilter">
                    <option value="all">All Categories</option>
                    <option value="Cloud">Cloud</option>
                    <option value="Security">Security</option>
                    <option value="IoT">IoT</option>
                    <option value="EdTech">EdTech</option>
                    <option value="FinTech">FinTech</option>
                    <option value="Software">Software</option>
                </select>
            </div>

            <!-- Product Grid -->
            <div class="row g-4" id="productGrid">
                <!-- cards rendered by JS -->
            </div>
            <div class="no-results" id="noResults">
                <i class="bi bi-box" style="font-size:3rem;display:block;margin-bottom:1rem;"></i>
                <h4>No products found</h4>
            </div>
        </div>
    </section>

    <!-- Stats Bar -->
    <section class="stats-bar">
        <div class="container">
            <div class="row g-4">
                <div class="col-6 col-md-3">
                    <h3>15+</h3>
                    <p>Product SKUs</p>
                </div>
                <div class="col-6 col-md-3">
                    <h3>500+</h3>
                    <p>Enterprise Clients</p>
                </div>
                <div class="col-6 col-md-3">
                    <h3>99.9%</h3>
                    <p>Uptime SLA</p>
                </div>
                <div class="col-6 col-md-3">
                    <h3>24/7</h3>
                    <p>Support</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer dynamically loaded -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script>
        // Product data (mirror backend)
        const products = [
            {
                id: 1,
                name: "Cloud Suite",
                category: "Cloud",
                price: "$299/mo",
                icon: "fa-cloud-arrow-up",
                desc: "Multi-cloud management platform with migration tools and cost optimization.",
                features: ["Multi-cloud support", "Automated migration", "Real-time monitoring"]
            },
            {
                id: 2,
                name: "SecureNet Firewall",
                category: "Security",
                price: "$1,499",
                icon: "fa-shield-haltered",
                desc: "AI-powered next-gen firewall with real-time intrusion prevention.",
                features: ["AI threat detection", "Intrusion prevention", "Central management"]
            },
            {
                id: 3,
                name: "IoT Sensor Kit Pro",
                category: "IoT",
                price: "$599",
                icon: "fa-microchip",
                desc: "Industrial-grade IoT sensor kit with 20+ sensors and cloud dashboard.",
                features: ["20+ sensor types", "Plug-and-play", "Cloud dashboard"]
            },
            {
                id: 4,
                name: "EduLearn LMS",
                category: "EdTech",
                price: "$199/mo",
                icon: "fa-graduation-cap",
                desc: "Learning Management System with virtual classrooms and automated assessments.",
                features: ["Virtual classrooms", "Automated assessments", "Mobile app"]
            },
            {
                id: 5,
                name: "FinPay Gateway",
                category: "FinTech",
                price: "Custom",
                icon: "fa-sack-dollar",
                desc: "Multi-currency payment gateway with mobile money and card processing.",
                features: ["Mobile money", "Card processing", "PCI-DSS"]
            },
            {
                id: 6,
                name: "DevStudio IDE",
                category: "Software",
                price: "$49/mo",
                icon: "fa-code",
                desc: "Cloud-based IDE with AI code completion and collaborative editing.",
                features: ["AI code completion", "Collaborative", "Git integration"]
            }
        ];

        // Render product cards
        function renderProducts(prods) {
            const grid = document.getElementById('productGrid');
            const noResults = document.getElementById('noResults');

            if (prods.length === 0) {
                grid.innerHTML = '';
                noResults.classList.add('show');
                return;
            }
            noResults.classList.remove('show');

            grid.innerHTML = prods.map(p => `
                <div class="col-lg-4 col-md-6">
                    <a href="/pages/product-detail/index.html?product=${p.id}" class="text-decoration-none">
                        <div class="product-card" data-aos="fade-up">
                            <div class="product-icon"><i class="fas ${p.icon}"></i></div>
                            <div class="product-category">${p.category}</div>
                            <h3>${p.name}</h3>
                            <p>${p.desc}</p>
                            <div class="product-price">${p.price}</div>
                            <span class="btn btn-outline-primary btn-sm mt-2">View Details</span>
                        </div>
                    </a>
                </div>
            `).join('');
        }

        // Filter function
        function filterProducts() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const filtered = products.filter(p =>
                (category === 'all' || p.category === category) &&
                (p.name.toLowerCase().includes(search) || p.desc.toLowerCase().includes(search))
            );
            renderProducts(filtered);
        }

        // Load header & footer
        async function loadComponent(url, containerId) {
            try {
                const resp = await fetch(url);
                document.getElementById(containerId).innerHTML = await resp.text();
            } catch (e) {
                console.error(e);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Load layout
            loadComponent('/components/layouts/header.html', 'header-container');
            loadComponent('/components/layouts/footer.html', 'footer-container');

            // Setup filters
            document.getElementById('searchInput').addEventListener('input', filterProducts);
            document.getElementById('categoryFilter').addEventListener('change', filterProducts);

            // Initial render
            renderProducts(products);

            // Initialize AOS
            if (typeof AOS !== 'undefined') AOS.init({ duration: 800, once: true });
        });
    </script>
</body>
</html>
