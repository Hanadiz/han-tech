<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Han-Tech Ltd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; margin: 0; }
        .page-hero {
            background: linear-gradient(135deg, #0f0f1a, #1a1a2e, #16213e);
            color: #fff; padding: 80px 0 50px; text-align: center;
        }
        .page-hero h1 { font-family: 'Poppins', sans-serif; font-size: 3rem; font-weight: 700; }
    </style>
</head>
<body>
    <div id="header-container"></div>
    <section class="page-hero"><div class="container"><h1>Our Products</h1><p>Explore our full range of software platforms and hardware solutions.</p></div></section>

    <div id="overview-container"></div>
   <div  id="reviews-container"></div>
    <div id="pricing-container"></div>
    <div id="roadmap-container"></div>
    <div id="documentation-container"></div>
    <div id="downloads-container"></div>
    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function load(url, containerId) {
            try {
                const r = await fetch(url);
                document.getElementById(containerId).innerHTML = await r.text();
            } catch(e) { console.error(e); }
        }

        (async function() {
            await load('/components/layouts/header.html', 'header-container');
            await load('/components/layouts/footer.html', 'footer-container');
            await load('/pages/products/overview.html', 'overview-container');
            await load('/pages/products/reviews.html',  'review-container');
            await load('/pages/products/pricing.html', 'pricing-container');
            await load('/pages/products/roadmap.html', 'roadmap-container');
            await load('/pages/products/documentation.html', 'documentation-container');
            await load('/pages/products/downloads.html', 'downloads-container');
        })();
    </script>
</body>
</html>
