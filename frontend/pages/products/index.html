<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Han-Tech Ltd</title>
    <meta name="description" content="Browse Han-Tech Ltd products: Cloud Suite, SecureNet Firewall, IoT Sensor Kit, EduLearn LMS, FinPay Gateway, and more.">
    <meta name="theme-color" content="#0a1628">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root { --primary-deep:#0a1628; --primary-blue:#0077b6; --primary-cyan:#00b4d8; --secondary-gold:#f4a261; --text-white:#fff; --text-gray:#a0a0b0; --card-bg:#111d32; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:var(--primary-deep); color:var(--text-white); }
        .hero { background:linear-gradient(160deg,#0a1628,#111d32); padding:5rem 0 3rem; text-align:center; }
        .hero-title { font-family:'Poppins',sans-serif; font-size:clamp(2rem,4vw,2.5rem); font-weight:800; }
        .text-gradient { background:linear-gradient(135deg,#0077b6,#00b4d8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .filter-bar { display:flex; gap:1rem; flex-wrap:wrap; justify-content:center; margin:2rem 0; }
        .search-box { position:relative; flex:1; max-width:350px; min-width:200px; }
        .search-box input { width:100%; padding:0.75rem 1rem 0.75rem 2.75rem; background:var(--card-bg); border:1px solid rgba(0,180,216,0.2); border-radius:12px; color:#fff; font-size:0.9rem; }
        .search-box i { position:absolute; left:1rem; top:50%; transform:translateY(-50%); color:#6b7280; }
        .filter-select { padding:0.75rem 1rem; background:var(--card-bg); border:1px solid rgba(0,180,216,0.2); border-radius:12px; color:#fff; font-size:0.9rem; cursor:pointer; min-width:150px; }
        .product-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:1.5rem; margin-top:2rem; }
        .product-card { background:var(--card-bg); border:1px solid rgba(0,180,216,0.08); border-radius:16px; overflow:hidden; transition:all 0.3s; text-decoration:none; color:inherit; position:relative; }
        .product-card:hover { transform:translateY(-6px); border-color:rgba(0,180,216,0.3); box-shadow:0 20px 40px rgba(0,0,0,0.3); }
        .badge { position:absolute; top:1rem; right:1rem; background:rgba(0,180,216,0.2); color:#00b4d8; padding:0.25rem 0.75rem; border-radius:50px; font-size:0.75rem; font-weight:600; }
        .img-placeholder { height:160px; display:flex; align-items:center; justify-content:center; font-size:3rem; color:rgba(255,255,255,0.2); }
        .card-body { padding:1.5rem; }
        .category { color:var(--secondary-gold); font-size:0.75rem; text-transform:uppercase; letter-spacing:1px; margin-bottom:0.5rem; }
        .name { font-family:'Poppins',sans-serif; font-size:1.1rem; font-weight:600; margin-bottom:0.5rem; }
        .desc { color:var(--text-gray); font-size:0.85rem; line-height:1.7; margin-bottom:1rem; }
        .footer { display:flex; justify-content:space-between; align-items:center; }
        .price { font-family:'Poppins',sans-serif; font-weight:700; color:var(--primary-cyan); }
        .no-results { text-align:center; padding:3rem; color:var(--text-gray); display:none; }
    </style>
</head>
<body>
    <div id="header-container"></div>
    <main>
        <section class="hero">
            <div class="container">
                <h1 class="hero-title">Our <span class="text-gradient">Technology Products</span></h1>
                <p class="text-gray mt-3">Ready-to-deploy solutions for modern enterprises.</p>
            </div>
        </section>
        <div class="container py-4">
            <div class="filter-bar">
                <div class="search-box"><i class="bi bi-search"></i><input type="text" id="searchInput" placeholder="Search products..."></div>
                <select class="filter-select" id="categoryFilter">
                    <option value="all">All Categories</option>
                    <option value="Cloud">Cloud</option>
                    <option value="Security">Security</option>
                    <option value="IoT">IoT</option>
                    <option value="EdTech">EdTech</option>
                    <option value="FinTech">FinTech</option>
                    <option value="Software">Software</option>
                </select>
            </div>
            <div class="product-grid" id="productGrid"></div>
            <div class="no-results" id="noResults"><i class="bi bi-box" style="font-size:3rem;display:block;margin-bottom:1rem;color:#6b7280;"></i><h4>No products found</h4></div>
        </div>
    </main>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const products = [
            { id:1, name:"Cloud Suite", category:"Cloud", price:"$299/mo", icon:"bi-cloud-arrow-up", badge:"Popular", desc:"Multi-cloud management platform.", color:"#0077b6" },
            { id:2, name:"SecureNet Firewall", category:"Security", price:"$1,499", icon:"bi-shield-lock", badge:"New", desc:"AI-powered next-gen firewall.", color:"#00b4d8" },
            { id:3, name:"IoT Sensor Kit Pro", category:"IoT", price:"$599", icon:"bi-cpu", badge:"", desc:"Industrial IoT kit.", color:"#f4a261" },
            { id:4, name:"EduLearn LMS", category:"EdTech", price:"$199/mo", icon:"bi-mortarboard", badge:"", desc:"Learning management system.", color:"#0077b6" },
            { id:5, name:"FinPay Gateway", category:"FinTech", price:"Custom", icon:"bi-cash-stack", badge:"Enterprise", desc:"Payment gateway.", color:"#00b4d8" },
            { id:6, name:"DevStudio IDE", category:"Software", price:"$49/mo", icon:"bi-code-slash", badge:"Beta", desc:"Cloud IDE with AI.", color:"#f4a261" }
        ];
        function render(prods) {
            const grid = document.getElementById('productGrid');
            const noRes = document.getElementById('noResults');
            if (!prods.length) { grid.innerHTML=''; noRes.style.display='block'; return; }
            noRes.style.display='none';
            grid.innerHTML = prods.map(p => `
                <a href="/public/pages/product-detail/index.html?product=${p.id}" class="product-card">
                    ${p.badge ? `<span class="badge">${p.badge}</span>` : ''}
                    <div class="img-placeholder" style="background:${p.color}15;"><i class="bi ${p.icon}"></i></div>
                    <div class="card-body">
                        <div class="category">${p.category}</div>
                        <h3 class="name">${p.name}</h3>
                        <p class="desc">${p.desc}</p>
                        <div class="footer"><span class="price">${p.price}</span><span class="text-cyan">Details →</span></div>
                    </div>
                </a>
            `).join('');
        }
        function filter() {
            const s = document.getElementById('searchInput').value.toLowerCase();
            const c = document.getElementById('categoryFilter').value;
            render(products.filter(p => (c==='all'||p.category===c) && (p.name.toLowerCase().includes(s)||p.desc.toLowerCase().includes(s))));
        }
        document.getElementById('searchInput').addEventListener('input', filter);
        document.getElementById('categoryFilter').addEventListener('change', filter);
        fetch('/components/layouts/header.html').then(r=>r.text()).then(h=>document.getElementById('header-container').innerHTML=h);
        fetch('/components/layouts/footer.html').then(r=>r.text()).then(h=>document.getElementById('footer-container').innerHTML=h);
        render(products);
    </script>
</body>
</html>
