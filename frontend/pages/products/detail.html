<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Detail | Han-Tech Ltd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f9fafb; }
        .product-detail { padding: 60px 0; }
        .product-img { width: 100%; max-height: 400px; object-fit: contain; }
    </style>
</head>
<body>
    <div id="header-container"></div>
    <section class="product-detail"><div class="container"><div class="row">
        <div class="col-md-6"><img src="https://via.placeholder.com/500x400?text=Product" class="product-img" alt=""></div>
        <div class="col-md-6"><h2>Enterprise Router</h2><p>$199</p><p>High‑performance router for small offices.</p><a href="#" class="btn btn-primary">Add to Cart</a></div>
    </div></div></section>
    <div id="reviews-container"></div>
    <div id="related-products-container"></div>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function load(u,i){ try{ const r=await fetch(u); document.getElementById(i).innerHTML=await r.text(); }catch(e){} }
        load('/components/layouts/header.html','header-container');
        load('/pages/products/reviews.html','reviews-container');
        load('/pages/products/related-products.html','related-products-container');
        load('/components/layouts/footer.html','footer-container');
    </script>
</body>
</html>
