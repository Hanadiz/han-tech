<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitemap | Han-Tech Ltd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ul { list-style: none; padding-left: 20px; }
    </style>
</head>
<body>
    <div id="header-container"></div>
    <div class="container py-5"><h1>Sitemap</h1><ul>
        <li><a href="/">Home</a></li>
        <li><a href="/pages/services/">Services</a></li>
        <li><a href="/pages/products/">Products</a></li>
        <li><a href="/pages/portfolio/">Portfolio</a></li>
        <li><a href="/pages/about/">About</a></li>
        <li><a href="/pages/contact/">Contact</a></li>
        <li><a href="/pages/faq/">FAQ</a></li>
        <li><a href="/pages/blog/">Blog</a></li>
    </ul></div>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function load(u,i){ try{ const r=await fetch(u); document.getElementById(i).innerHTML=await r.text(); }catch(e){} }
        load('/components/layouts/header.html','header-container');
        load('/components/layouts/footer.html','footer-container');
    </script>
</body>
</html>
