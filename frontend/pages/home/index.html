<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Han-Tech Ltd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
    <style>
        :root { --bg-primary: #f9fafb; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: #2c3e50; margin: 0; }
        [data-theme="dark"] body { background: #0f0f1a; color: #e0e0e0; }
        .section-title { font-family: 'Poppins', sans-serif; }

        /* Back‑to‑top */
        .back-to-top {
            position: fixed; bottom: 30px; right: 30px;
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            color: #fff; border: 2px solid rgba(255,255,255,0.2);
            border-radius: 14px; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; cursor: pointer; z-index: 999;
            opacity: 0; visibility: hidden; transform: translateY(20px);
            transition: all 0.3s ease; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        .back-to-top.visible { opacity: 1; visibility: visible; transform: translateY(0); }
        .back-to-top:hover { transform: translateY(-4px) !important; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
    </style>
</head>
<body>
<!-- Add these new containers in the body -->
<div id="clients-container"></div>
<div id="trust-container"></div>
<div id="pricing-preview-container"></div>
<div id="portfolio-preview-container"></div>
<div id="team-preview-container"></div>
<div id="faq-preview-container"></div>
<div id="subscribe-container"></div>
    <div id="header-container"></div>
    <div id="hero-container"></div>
    <div id="featured-container"></div>
    <div id="why-us-container"></div>
    <div id="testimonials-container"></div>
    <div id="stats-container"></div>
    <div id="blog-container"></div>
    <div id="partners-container"></div>
    <div id="cta-container"></div>
    <div id="footer-container"></div>

    <button class="back-to-top" id="backToTop" aria-label="Back to top">
        <i class="bi bi-arrow-up"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
        async function load(url, containerId) {
            try {
                const r = await fetch(url);
                document.getElementById(containerId).innerHTML = await r.text();
            } catch(e) { console.error(e); }
        }

        (async function() {
            await load('/components/layouts/header.html', 'header-container');
            await load('/pages/home/hero-banner.html', 'hero-container');
            await load('/pages/home/featured-services.html', 'featured-container');
            await load('/pages/home/why-choose-us.html', 'why-us-container');
            await load('/pages/home/testimonials.html', 'testimonials-container');
            await load('/pages/home/stats-bar.html', 'stats-container');
            await load('/pages/home/recent-blog.html', 'blog-container');
            await load('/pages/home/partners.html', 'partners-container');
            await load('/pages/home/cta-section.html', 'cta-container');
// Add these load calls in the script
await load('/pages/home/clients-counter.html', 'clients-container');
await load('/pages/home/trust-badges.html', 'trust-container');
await load('/pages/home/pricing-preview.html', 'pricing-preview-container');
await load('/pages/home/portfolio-preview.html', 'portfolio-preview-container');
await load('/pages/home/team-preview.html', 'team-preview-container');
await load('/pages/home/faq-preview.html', 'faq-preview-container');
await load('/pages/home/subscribe-section.html', 'subscribe-container');

            await load('/components/layouts/footer.html', 'footer-container');

            AOS.init({ duration: 800, once: true, offset: 50 });

            const backBtn = document.getElementById('backToTop');
            window.addEventListener('scroll', () => backBtn.classList.toggle('visible', window.scrollY > 400));
            backBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
        })();
    </script>
</body>
</html>
