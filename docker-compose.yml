version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: han-tech-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://hanadiz-api.onrender.com
      - DB_CONNECTION=pgsql
      - DB_HOST=dpg-d8v368rsq97s73ftekv0-a
      - DB_PORT=5432
      - DB_DATABASE=hanadiz_db
      - DB_USERNAME=hanadiz_user
      - DB_PASSWORD=upIuiVL1O5VuTLQITwKQLvMnI7kpWysv
      - SESSION_DRIVER=database
      - SESSION_LIFETIME=120
      - SESSION_DOMAIN=hanadiz-api.onrender.com
      - SESSION_SECURE_COOKIE=true
    volumes:
      - ./backend:/var/www/html
      - ./storage:/var/www/html/storage
    networks:
      - han-tech-network
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: han-tech-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - han-tech-network

networks:
  han-tech-network:
    driver: bridge